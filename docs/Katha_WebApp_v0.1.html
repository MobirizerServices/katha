<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katha — Watch</title>
<meta name="robots" content="noindex">
<meta name="apple-itunes-app" content="app-id=0000000000">
<meta name="theme-color" content="#0B0B0F">
<style>
:root{
  --bg:#0B0B0F; --surface:#16161D; --raised:#1F1F28; --line:#23232C;
  --text:#F5F5F7; --text2:#A1A1AA; --text3:#6B6B75;
  --accent:#FF5C3A; --accent-p:#E04A2B; --coin:#F5C042; --ok:#2FBF71; --danger:#FF4D4F; --info:#5CA8FF;
  --nav-h:64px; --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:#33333d var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
img{display:block}
::-webkit-scrollbar{height:8px;width:10px}::-webkit-scrollbar-thumb{background:#2A2A33;border-radius:5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}.ic.xs{width:15px;height:15px}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- app banner (mobile) ---------- */
.appbanner{display:none;align-items:center;gap:10px;padding:8px 12px;background:#111118;border-bottom:1px solid var(--line);font-size:13px}
.appbanner img,.appbanner svg{border-radius:8px}
.appbanner b{display:block;font-size:13px}
.appbanner span{color:var(--text2);font-size:11px}
.appbanner .get{margin-left:auto;background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px}

/* ---------- nav ---------- */
header.nav{position:sticky;top:0;z-index:60;height:var(--nav-h);display:flex;align-items:center;gap:22px;padding:0 max(20px,4vw);background:linear-gradient(to bottom,rgba(11,11,15,.95),rgba(11,11,15,.75));backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.04)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.03em}
.brand small{font-weight:500;color:var(--text2);font-size:14px}
nav.links{display:flex;gap:20px;font-size:14.5px}
nav.links a{color:var(--text2);padding:6px 2px;font-weight:500}
nav.links a:hover{color:var(--text)}
nav.links a[aria-current="page"]{color:var(--text);font-weight:600}
.nsp{flex:1}
.nbtn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}
.nbtn:hover{background:var(--surface);color:var(--text)}
.coinpill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.coinpill:hover{background:var(--raised)}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A3,#F5C042 58%,#B8861B);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18);flex:none}
.coin.s{width:14px;height:14px}
.coin.lg{width:26px;height:26px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#C2553D,#3B1F2B);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.signin{height:36px;padding:0 16px;border-radius:999px;background:var(--text);color:#0B0B0F;font-weight:700;font-size:14px}
.searchbar{display:none;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;height:40px;padding:0 16px;width:min(440px,42vw)}
.searchbar input{flex:1;background:none;border:0;color:var(--text);font:inherit;outline:none;min-width:0}
.searchbar.on{display:flex}
main{min-height:calc(100vh - var(--nav-h))}
.page{display:none;padding-bottom:72px}
.page.on{display:block}
.wrap{padding:0 max(20px,4vw)}

/* ---------- billboard ---------- */
.billboard{position:relative;min-height:min(72vh,640px);display:flex;align-items:flex-end;isolation:isolate;overflow:hidden}
.billboard .art{position:absolute;inset:0;z-index:-2;background:linear-gradient(160deg,var(--c1),var(--c2))}
.billboard .art img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) brightness(.8)}
.billboard .art::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.4;mix-blend-mode:multiply}
.billboard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--bg) 4%,rgba(11,11,15,.55) 40%,rgba(11,11,15,.15) 70%,rgba(11,11,15,.35)),linear-gradient(to right,rgba(11,11,15,.82),transparent 62%)}
.bb{padding:0 max(20px,4vw) 46px;max-width:640px}
.bb .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:12px}
.bb h1{font-size:clamp(34px,5vw,58px);line-height:1.0;letter-spacing:-.03em;margin:0 0 10px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.bb .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--text2);font-size:14px;margin-bottom:12px}
.bb .hook{font-size:17px;color:#E8E8EC;max-width:46ch;margin:0 0 22px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.rating{border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:1px 6px;font-size:11.5px;font-weight:700;color:#fff}
.dotsep::before{content:"·";margin:0 2px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15.5px}
.btn.p{background:var(--accent);color:#fff}.btn.p:hover{background:var(--accent-p)}
.btn.s{background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}.btn.s:hover{background:rgba(255,255,255,.2)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.25)}.btn.ghost:hover{border-color:#fff}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn.gold{background:var(--coin);color:#241B02}.btn.gold:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bb .ctas{display:flex;gap:12px;align-items:center}
.freebadge{position:absolute;top:calc(var(--nav-h) + 14px);right:max(20px,4vw);background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}

/* ---------- rows & cards ---------- */
.row{margin-top:34px}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 max(20px,4vw);margin-bottom:12px}
.rowhead h2{font-size:19px;margin:0;letter-spacing:-.01em;font-weight:700}
.rowhead a{font-size:13px;color:var(--text2)}
.rowhead a:hover{color:var(--text)}
.strip{position:relative}
.scroller{display:flex;gap:12px;overflow-x:auto;padding:4px max(20px,4vw) 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.card{width:152px;flex:none;scroll-snap-align:start;position:relative}
.card .poster{aspect-ratio:2/3;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));isolation:isolate;transition:transform .18s ease,box-shadow .18s ease}
.card .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(1.05) brightness(.88)}
.card .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.42;mix-blend-mode:multiply}
.card .poster::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 55%)}
.card:hover .poster{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.card .t{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;font-weight:800;font-size:15px;line-height:1.1;letter-spacing:-.015em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card .badge{position:absolute;top:8px;left:8px;z-index:2;height:22px;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.card .badge.new{background:var(--accent)}
.card .badge.lang{left:auto;right:8px;background:rgba(0,0,0,.45)}
.card .playov{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.card:hover .playov{opacity:1}
.card .playov i{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.card .sub{margin-top:8px;font-size:12.5px;color:var(--text2);line-height:1.35}
.card .prog{height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:8px;overflow:hidden}
.card .prog i{display:block;height:100%;background:var(--accent)}
.card.cont{width:210px}
.card.cont .poster{aspect-ratio:16/10}
.arrow{position:absolute;top:0;bottom:14px;width:52px;display:flex;align-items:center;justify-content:center;z-index:5;opacity:0;transition:opacity .15s;color:#fff}
.arrow.l{left:0;background:linear-gradient(to right,rgba(11,11,15,.85),transparent)}
.arrow.r{right:0;background:linear-gradient(to left,rgba(11,11,15,.85),transparent)}
.strip:hover .arrow{opacity:1}
.arrow svg{width:30px;height:30px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:18px max(20px,4vw) 0}
.chip{height:34px;padding:0 15px;border-radius:999px;background:var(--surface);color:var(--text2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:rgba(255,92,58,.16);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:20px max(20px,4vw)}
.grid .card{width:auto}

/* ---------- series page ---------- */
.shero{position:relative;min-height:400px;display:flex;align-items:flex-end;isolation:isolate;overflow:hidden}
.shero .art{position:absolute;inset:0;z-index:-2;background:linear-gradient(160deg,var(--c1),var(--c2))}
.shero .art img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) brightness(.75)}
.shero .art::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.42;mix-blend-mode:multiply}
.shero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--bg) 2%,rgba(11,11,15,.5) 45%,rgba(11,11,15,.2)),linear-gradient(to right,rgba(11,11,15,.8),transparent 60%)}
.sinfo{padding:90px max(20px,4vw) 34px;display:flex;gap:26px;align-items:flex-end;width:100%}
.sinfo .poster{width:150px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 18px 44px rgba(0,0,0,.5);flex:none;isolation:isolate}
.sinfo .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.75) brightness(.9)}
.sinfo .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.4;mix-blend-mode:multiply}
.sinfo h1{font-size:clamp(30px,4vw,46px);margin:0 0 8px;letter-spacing:-.03em;line-height:1.02;font-weight:800}
.sinfo .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--text2);font-size:14px;margin-bottom:14px}
.sinfo .ctas{display:flex;gap:10px;flex-wrap:wrap}
.sbody{display:grid;grid-template-columns:1fr 380px;gap:36px;padding:26px max(20px,4vw) 0;align-items:start}
.syn{color:#D6D6DC;max-width:70ch}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.fact{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--text2)}
.bundle{background:linear-gradient(140deg,#241a10,#171310);border:1px solid #3a2c17;border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center;margin-top:18px}
.bundle .coin.lg{box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),0 0 24px rgba(245,192,66,.35)}
.bundle b{display:block;font-size:15px}
.bundle span{font-size:13px;color:var(--text2)}
.bundle .btn{margin-left:auto}
.epspanel h3{font-size:17px;margin:0 0 4px;display:flex;align-items:baseline;justify-content:space-between}
.epspanel h3 span{font-size:12.5px;color:var(--text2);font-weight:500}
.eps{background:var(--surface);border-radius:var(--r);overflow:hidden;max-height:560px;overflow-y:auto}
.ep{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;position:relative}
.ep:hover{background:var(--raised)}
.ep:last-child{border-bottom:0}
.ep .n{width:26px;font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums;text-align:right}
.ep .th{width:64px;aspect-ratio:9/13;border-radius:8px;background:linear-gradient(160deg,var(--c1),var(--c2));position:relative;overflow:hidden;flex:none;filter:saturate(.8)}
.ep .th i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.ep .tt{flex:1;min-width:0}
.ep .tt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .tt span{font-size:12px;color:var(--text2)}
.ep .right{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);flex:none}
.ep .free{color:var(--ok);font-weight:700;font-size:12px;letter-spacing:.03em}
.ep .price{display:flex;align-items:center;gap:5px;font-weight:700;color:var(--text)}
.ep.now{background:rgba(255,92,58,.1)}
.ep.now .tt b{color:var(--accent)}
.ep .done{color:var(--ok)}
.ep.locked .th::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.lockic{width:14px;height:14px}

/* ---------- player ---------- */
.playerpage{position:fixed;inset:0;z-index:80;background:#000;display:none}
.playerpage.on{display:block}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.backfill{position:absolute;inset:0;overflow:hidden}
.backfill img{width:100%;height:100%;object-fit:cover;filter:blur(60px) brightness(.35) saturate(.8);transform:scale(1.2)}
.video{position:relative;height:100%;aspect-ratio:9/16;max-width:100vw;background:radial-gradient(75% 55% at 38% 34%,var(--v1) 0%,var(--v2) 42%,#0B0B0F 100%);overflow:hidden;isolation:isolate}
.video img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.06) brightness(.78)}
.video .grain{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 22%,transparent 58%,rgba(0,0,0,.75))}
.video .paused{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.video .paused i{width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.subt{position:absolute;left:6%;right:6%;bottom:132px;text-align:center;font-size:clamp(15px,2.4vh,19px);line-height:1.4;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.85);z-index:3}
.ptop{position:absolute;top:0;left:0;right:0;padding:16px 18px;display:flex;align-items:center;gap:8px;z-index:14;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent)}
.ptop .name{font-size:13.5px;color:#E7E7EC;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ptop .name b{display:block;font-size:15px}
.pbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.pbtn:hover{background:rgba(0,0,0,.55)}
.pbtn.on{color:var(--accent)}
.pbottom{position:absolute;left:0;right:0;bottom:0;padding:0 18px calc(16px + env(safe-area-inset-bottom));z-index:6;background:linear-gradient(to top,rgba(0,0,0,.65),transparent)}
.ptitle{font-size:14px;color:#E7E7EC;margin-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ptitle b{display:block;font-size:16px;letter-spacing:-.01em}
.seek{position:relative;height:20px;display:flex;align-items:center;cursor:pointer}
.seek .tr{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
.seek .buf{position:absolute;left:0;height:3px;border-radius:2px;background:rgba(255,255,255,.45);width:0}
.seek .pl{position:absolute;left:0;height:3px;border-radius:2px;background:var(--accent);width:0}
.seek .hd{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;margin-left:-7px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pctrl{display:flex;align-items:center;gap:6px;margin-top:6px}
.ptime{font-size:12.5px;color:#CFCFD6;font-variant-numeric:tabular-nums;margin:0 6px}
.prail{position:absolute;right:14px;bottom:170px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:5}
.prail button{display:flex;flex-direction:column;gap:5px;align-items:center;color:#fff;font-size:11.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.prail .ic{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.prail .liked{color:var(--accent)}
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(10px)}
.ocard{width:min(400px,88%);background:var(--surface);border-radius:20px;padding:26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.ocard h3{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.ocard p{margin:0 0 18px;color:var(--text2);font-size:14px}
.balance{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--raised);border-radius:12px;padding:12px;margin-bottom:16px;font-weight:700}
.balance small{font-weight:500;color:var(--text2)}
.ocard .btn{width:100%;margin-top:10px}
.olink{display:inline-block;margin-top:16px;color:var(--text2);font-size:13.5px}
.olink:hover{color:var(--text)}
.countring{width:64px;height:64px;margin:0 auto 14px;position:relative}
.countring svg{transform:rotate(-90deg)}
.countring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.unlockflash{position:absolute;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;background:rgba(11,11,15,.65);backdrop-filter:blur(6px)}
.unlockflash .in{text-align:center}
.unlockflash .ring{width:84px;height:84px;border-radius:50%;background:rgba(47,191,113,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--ok)}
.epsheet{position:absolute;top:0;right:0;bottom:0;width:min(400px,92vw);background:rgba(17,17,24,.92);backdrop-filter:blur(20px);z-index:12;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.epsheet.on{transform:none}
.epsheet h3{margin:0;padding:18px;font-size:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.06)}
.epsheet .eps{background:transparent;border-radius:0;max-height:none;flex:1}

/* ---------- coin store ---------- */
.storehead{padding:44px max(20px,4vw) 8px;max-width:760px}
.storehead h1{font-size:clamp(26px,3.6vw,38px);margin:0 0 8px;letter-spacing:-.025em}
.storehead p{color:var(--text2);margin:0}
.walletbar{margin:20px max(20px,4vw) 0;display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:16px 18px;max-width:760px}
.walletbar b{font-size:22px;font-variant-numeric:tabular-nums}
.walletbar span{color:var(--text2);font-size:13px}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:22px max(20px,4vw);max-width:1200px}
.pack{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;text-align:left;transition:transform .15s,border-color .15s}

const access=(s,n)=>isFree(s,n)||U.unlocked[s.id]==='all'||(U.unlocked[s.id]&&U.unlocked[s.id].has(n));
function spend(amount){ const useN=Math.min(U.coins.n,amount); U.coins.n-=useN; U.coins.b-=(amount-useN); }
function ledger(t,ref,d){ U.ledger.unshift({t,ref,d,when:'Just now'}); }

/* ============================ ui helpers ============================ */
const toastEl=$('#toast'); let tT;
function toast(m){ toastEl.textContent=m; toastEl.classList.add('on'); clearTimeout(tT); tT=setTimeout(()=>toastEl.classList.remove('on'),2800); }
const modal=$('#modal'), scrim=$('#scrim');
function openModal(html){ modal.innerHTML=html; modal.classList.add('on'); scrim.classList.add('on'); const f=modal.querySelector('input,button:not(.x)'); if(f) setTimeout(()=>f.focus(),40); }
function closeModal(){ modal.classList.remove('on'); scrim.classList.remove('on'); modal.innerHTML=''; }
scrim.addEventListener('click',closeModal);
function updateNav(){ $('#navcoins').textContent=fmt(bal()); const a=$('#authbtn'); if(U.signed){ a.className='avatar'; a.textContent=U.name[0]||'M'; a.setAttribute('data-act','go'); a.setAttribute('data-to','#/profile'); a.setAttribute('aria-label','Profile'); } else { a.className='signin'; a.textContent='Sign in'; a.setAttribute('data-act','signin'); a.removeAttribute('data-to'); } const v=route().v; $$('nav.links a').forEach(x=>{ const m={home:'#/',browse:'#/browse',mylist:'#/mylist'}[x.dataset.nav]; if((v==='home'&&x.dataset.nav==='home')||('#/'+v===m)) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current'); }); }
const posterImg=(s,w,h,kind)=>`<img src="${IMG(kind==='scene'?s.skw:s.kw,kind==='scene'?s.slock:s.lock,w,h)}" alt="" loading="lazy" onerror="this.remove()">`;

   ${o.cont?'':`<span class="badge lang" style="top:auto;bottom:38px;display:none"></span>`}

   <span class="t">${esc(s.t)}</span>
  </div>

 </a>`; }

/* ============================ router ============================ */
const main=$('#main'), pp=$('#playerpage');
function route(){ const h=(location.hash||'#/').slice(2); const p=h.split('/'); if(p[0]==='watch') return {v:'watch',s:p[1],n:+p[2]||1}; if(p[0]==='series') return {v:'series',id:p[1]}; if(p[0]==='browse') return {v:'browse',f:decodeURIComponent(p[1]||'All')}; if(p[0]==='search') return {v:'search',q:decodeURIComponent(p[1]||'')}; return {v:p[0]||'home'}; }
let lastNonWatch='#/';
function render(){ const r=route();
 if(r.v==='watch'){ const s=byId(r.s); if(!s){ location.hash='#/'; return; } openPlayer(s,r.n); updateNav(); return; }
 closePlayer(); lastNonWatch=location.hash||'#/';
 const html = r.v==='series'?V.series(r.id) : r.v==='browse'?V.browse(r.f) : r.v==='search'?V.search(r.q) : (V[r.v]||V.home)();
 main.innerHTML=`<div class="page on">${html}</div>`; updateNav(); window.scrollTo(0,0); }
window.addEventListener('hashchange',render);

/* ============================ player ============================ */
const PL={s:null,n:1,t:0,dur:60,playing:false,timer:null,cc:true,mut:false,sheet:false,over:null};
function subtitleFor(s,t){ const lines=SUBS[langKey(s)]; if(!lines) return ''; return lines[Math.floor(t/7)%lines.length]; }
function gate(s,fn){ if(U.settings.lock&&(s.rating==='U/A 16+'||s.rating==='A')&&!U.pinOk.has(s.id)){ pinModal(s,fn); } else fn(); }
function openPlayer(s,n){ const e=eps(s)[n-1]; if(!e){ location.hash='#/series/'+s.id; return; }
 gate(s,()=>{ PL.s=s; PL.n=n; PL.dur=e.dur; PL.cc=U.settings.subs; PL.sheet=false;
  const acc=access(s,n); PL.over=acc?null:'paywall'; const p=U.progress[s.id];
  PL.t=(acc&&p&&p.n===n)?Math.min(p.t,e.dur-1):0; PL.playing=acc;
  pp.classList.add('on'); document.body.style.overflow='hidden'; drawPlayer(); startTick(); }); }
function closePlayer(){ if(!pp.classList.contains('on')) return; stopTick(); saveProgress(); pp.classList.remove('on'); pp.innerHTML=''; document.body.style.overflow=''; }
function saveProgress(){ if(!PL.s||PL.over==='paywall') return; if(PL.t>3&&PL.t<PL.dur-2){ U.progress[PL.s.id]={n:PL.n,t:PL.t,dur:PL.dur}; } }
function startTick(){ stopTick(); PL.timer=setInterval(()=>{ if(!PL.playing||PL.over) return; PL.t+=0.25; if(PL.t>=PL.dur){ ended(); return; } tickUI(); },250); }
function stopTick(){ clearInterval(PL.timer); PL.timer=null; }
function ended(){ PL.t=PL.dur; PL.playing=false; (U.watched[PL.s.id]=U.watched[PL.s.id]||new Set()).add(PL.n); delete U.progress[PL.s.id];
 const next=PL.n+1; if(next>PL.s.total){ PL.over='fin'; } else if(access(PL.s,next)){ PL.over=U.settings.autoplay?'next':'nextman'; if(PL.over==='next'){ PL.count=5; PL.cd=setInterval(()=>{ PL.count--; if(PL.count<=0){ clearInterval(PL.cd); go(next); } else { const b=$('#cdn'); if(b) b.textContent=PL.count; const c=$('#cdc'); if(c) c.setAttribute('stroke-dashoffset',163-(163*(5-PL.count)/5)); } },1000); } } else { PL.over='paywall'; U.progress[PL.s.id]={n:PL.n,t:0,dur:PL.dur}; }
 drawPlayer(); }
function go(n){ clearInterval(PL.cd); location.hash=`#/watch/${PL.s.id}/${n}`; }
function tickUI(){ const pct=PL.t/PL.dur*100; const pl=$('#seekpl'),hd=$('#seekhd'),bf=$('#seekbf'),tm=$('#ptime'),sub=$('#psub');
 if(pl){ pl.style.width=pct+'%'; hd.style.left=pct+'%'; bf.style.width=Math.min(100,pct+9)+'%'; tm.textContent=`${mmss(PL.t)} / ${mmss(PL.dur)}`; }
 if(sub) sub.textContent=PL.cc?subtitleFor(PL.s,PL.t):''; }
function drawPlayer(){ const s=PL.s, e=eps(s)[PL.n-1]; const pct=PL.t/PL.dur*100; const liked=U.likes.has(s.id+PL.n);
 const epList=eps(s).map(x=>{ const acc=access(s,x.n); return `<div class="ep ${acc?'':'locked'} ${x.n===PL.n?'now':''}" data-act="watch" data-s="${s.id}" data-n="${x.n}"><span class="n">${x.n}</span><span class="th" style="--c1:${s.c1};--c2:${s.c2}"></span><span class="tt"><b>${esc(x.title)}</b><span>${mmss(x.dur)}</span></span><span class="right">${acc?(isFree(s,x.n)?'<span class="free">FREE</span>':'<svg class="ic s" style="color:var(--info)"><use href="#i-check"/></svg>'):`<span class="price"><span class="coin s"></span>${s.price}</span>`}</span></div>`; }).join('');
 let over='';
 if(PL.over==='paywall'){ const need=s.price-bal(); const remaining=eps(s).filter(x=>!access(s,x.n)).length; const bundleCost=Math.round(remaining*s.price*0.75);
  over=`<div class="overlay"><div class="ocard"><h3>Unlock Episode ${PL.n}</h3><p>${esc(e.title)} · ${mmss(e.dur)} · then keep bingeing</p>
   ${U.signed?`<div class="balance"><span class="coin"></span>${fmt(bal())} <small>coins in your wallet</small></div>
   ${need>0?`<button class="btn gold" data-act="go" data-to="#/coins" data-pend="1">Get coins · you need ${need} more</button><button class="btn s" disabled>Unlock for ${s.price}</button>`:`<button class="btn p" data-act="unlock" data-s="${s.id}" data-n="${PL.n}"><span class="coin s" style="box-shadow:none"></span>Unlock for ${s.price} coins</button>${remaining>1?`<button class="btn s" data-act="bundle" data-s="${s.id}">Unlock all ${remaining} left · ${fmt(bundleCost)} <span style="color:var(--coin)">−25%</span></button>`:''}`}`
   :`<p style="margin-top:-6px">Your first ${s.free} episodes were free. Sign in with your phone to unlock the rest with coins — about ₹4.5 an episode.</p><button class="btn p" data-act="signin" data-pend="1">Sign in to continue</button>`}
   <a class="olink" href="#/series/${s.id}">Not now — back to the series</a></div></div>`; }
 else if(PL.over==='next'){ const nx=eps(s)[PL.n]; over=`<div class="overlay"><div class="ocard"><div class="countring"><svg width="64" height="64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--raised)" stroke-width="5"/><circle id="cdc" cx="32" cy="32" r="26" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="163"/></svg><b id="cdn">5</b></div><h3>Up next · E${PL.n+1}</h3><p>${esc(nx.title)}</p><button class="btn p" data-act="gonext">Play now</button><button class="btn s" data-act="cancelnext">Cancel</button></div></div>`; }
 else if(PL.over==='nextman'){ over=`<div class="overlay"><div class="ocard"><h3>Episode ${PL.n} finished</h3><p>Autoplay is off.</p><button class="btn p" data-act="gonext">Play E${PL.n+1}</button><button class="btn s" data-act="replay">Replay</button><a class="olink" href="#/series/${s.id}">Back to series</a></div></div>`; }
 else if(PL.over==='fin'){ over=`<div class="overlay"><div class="ocard"><h3>You finished ${esc(s.t)} 🎉</h3><p>${s.id==='kaanch-ka-mahal'?'Season 2 is in the works. ':''}Here\u2019s what to watch next.</p><button class="btn p" data-act="go" data-to="#/series/saat-pheron-ka-sauda">Saat Pheron Ka Sauda</button><button class="btn s" data-act="go" data-to="#/">Back to Home</button></div></div>`; }
 else if(PL.over==='unlocked'){ over=`<div class="unlockflash"><div class="in"><div class="ring"><svg class="ic" style="width:38px;height:38px"><use href="#i-check"/></svg></div><b style="font-size:18px">Episode ${PL.n} unlocked</b><div style="color:var(--text2);font-size:13px;margin-top:4px">−${s.price} coins · balance ${fmt(bal())}</div></div></div>`; }
 pp.innerHTML=`<div class="stage"><div class="backfill">${posterImg(s,900,1400,'scene')}</div>
  <div class="video" style="--v1:${s.v1};--v2:${s.v2}">${posterImg(s,390,844,'scene')}<div class="grain"></div>
   ${PL.playing||PL.over?'':`<button class="paused" data-act="pp" aria-label="Play"><i><svg class="ic fill" style="width:34px;height:34px;color:#fff"><use href="#i-play"/></svg></i></button>`}
   <div class="ptop"><button class="pbtn" data-act="pback" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button><div class="name"><b>${esc(s.t)}</b>E${PL.n} · ${esc(e.title)}</div><span style="flex:1"></span><button class="pbtn ${PL.cc?'on':''}" data-act="cc" aria-label="Subtitles"><svg class="ic"><use href="#i-cc"/></svg></button><button class="pbtn" data-act="mute" aria-label="Mute">${PL.mut?'<svg class="ic"><use href="#i-mute"/></svg>':'<svg class="ic"><use href="#i-vol"/></svg>'}</button></div>
   <div class="prail"><button data-act="like" aria-pressed="${liked}"><svg class="ic ${liked?'liked':''}" style="${liked?'fill:currentColor;stroke:none':''}"><use href="#i-heart"/></svg>${fmt(12300+PL.n*7+(liked?1:0))}</button><button data-act="sheet"><svg class="ic"><use href="#i-eps"/></svg>E${PL.n}</button><button data-act="toast" data-msg="Link copied — sharing sends friends to E1 free"><svg class="ic"><use href="#i-share"/></svg>Share</button></div>
   <div id="psub" class="subt">${PL.cc&&PL.playing?esc(subtitleFor(s,PL.t)):''}</div>
   <div class="pbottom"><div class="ptitle">${isFree(s,PL.n)?`Free episode ${PL.n} of ${s.free}`:'Unlocked episode'} · ${esc(s.lang)}</div>
    <div class="seek" data-act="seek" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="${PL.dur}" aria-valuenow="${Math.round(PL.t)}"><div class="tr"></div><div class="buf" id="seekbf" style="width:${Math.min(100,pct+9)}%"></div><div class="pl" id="seekpl" style="width:${pct}%"></div><div class="hd" id="seekhd" style="left:${pct}%"></div></div>
    <div class="pctrl"><button class="pbtn" data-act="pp" aria-label="${PL.playing?'Pause':'Play'}">${PL.playing?'<svg class="ic fill"><use href="#i-pause"/></svg>':'<svg class="ic fill"><use href="#i-play"/></svg>'}</button><button class="pbtn" data-act="gonextbtn" aria-label="Next episode"><svg class="ic fill"><use href="#i-next"/></svg></button><span class="ptime" id="ptime">${mmss(PL.t)} / ${mmss(PL.dur)}</span><span style="flex:1"></span><button class="pbtn" data-act="speed" aria-label="Speed">1×</button><button class="pbtn" data-act="toast" data-msg="Fullscreen (browser)" aria-label="Fullscreen"><svg class="ic"><use href="#i-full"/></svg></button></div></div>
   ${over}</div>
  <div class="epsheet ${PL.sheet?'on':''}" id="epsheet"><h3>Episodes · ${esc(s.t)}<button class="x" data-act="sheet" aria-label="Close"><svg class="ic s"><use href="#i-x"/></svg></button></h3><div class="eps">${epList}</div></div></div>`; }

/* ============================ auth, pin, purchase ============================ */
function signinModal(pend){ openModal(`<div class="mh"><h2>Sign in</h2><button class="x" data-act="mclose"><svg class="ic s"><use href="#i-x"/></svg></button></div><div class="mb"><p class="d">One account across web and iPhone. We\u2019ll text a code — no password.</p><label class="fld">Phone<input id="ph" inputmode="tel" placeholder="+91 98765 43210" value="+91 98765 43210"></label><button class="btn p" style="width:100%" data-act="otp" ${pend?'data-pend="1"':''}>Send code</button><p style="color:var(--text3);font-size:12px;margin:14px 0 0;text-align:center">By continuing you agree to the Terms and confirm you\u2019re 18+.</p></div>`); }
function otpModal(pend){ openModal(`<div class="mh"><h2>Enter the code</h2><button class="x" data-act="mclose"><svg class="ic s"><use href="#i-x"/></svg></button></div><div class="mb"><p class="d">Sent to ${esc(U.phone)} · <a href="#" data-act="toast" data-msg="Code re-sent">resend</a></p><div class="otp">${[0,1,2,3].map(i=>`<input id="o${i}" inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}">`).join('')}</div><button class="btn p" style="width:100%;margin-top:16px" data-act="verify" ${pend?'data-pend="1"':''}>Verify</button><p style="color:var(--text3);font-size:12px;margin:14px 0 0;text-align:center">Demo: any 4 digits work.</p></div>`);
 $$('.otp input').forEach((inp,i)=>{ inp.addEventListener('input',()=>{ if(inp.value&&i<3) $('#o'+(i+1)).focus(); }); inp.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!inp.value&&i>0) $('#o'+(i-1)).focus(); }); }); }
function pinModal(s,fn){ openModal(`<div class="mh"><h2>Parental lock</h2><button class="x" data-act="mclose"><svg class="ic s"><use href="#i-x"/></svg></button></div><div class="mb"><p class="d">${esc(s.t)} is rated ${s.rating}. Enter your 4-digit PIN to continue.</p><div class="pinpad">${[0,1,2,3].map(i=>`<input id="p${i}" type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit ${i+1}">`).join('')}</div><button class="btn p" style="width:100%;margin-top:14px" id="pingo">Unlock</button></div>`);
 $$('.pinpad input').forEach((inp,i)=>inp.addEventListener('input',()=>{ if(inp.value&&i<3) $('#p'+(i+1)).focus(); }));
 $('#pingo').addEventListener('click',()=>{ const pin=[0,1,2,3].map(i=>$('#p'+i).value).join(''); if(pin===U.settings.pin){ U.pinOk.add(s.id); closeModal(); fn(); } else { toast('Wrong PIN'); } }); }
function setPinModal(){ openModal(`<div class="mh"><h2>Set a parental PIN</h2><button class="x" data-act="mclose"><svg class="ic s"><use href="#i-x"/></svg></button></div><div class="mb"><p class="d">This PIN will be required before any U/A 16+ or A title plays.</p><div class="pinpad">${[0,1,2,3].map(i=>`<input id="sp${i}" inputmode="numeric" maxlength="1" aria-label="PIN digit ${i+1}">`).join('')}</div><button class="btn p" style="width:100%;margin-top:14px" id="setpin">Turn on lock</button></div>`);
 $$('.pinpad input').forEach((inp,i)=>inp.addEventListener('input',()=>{ if(inp.value&&i<3) $('#sp'+(i+1)).focus(); }));
 $('#setpin').addEventListener('click',()=>{ const pin=[0,1,2,3].map(i=>$('#sp'+i).value).join(''); if(!/^\d{4}$/.test(pin)){ toast('Enter 4 digits'); return; } U.settings.pin=pin; U.settings.lock=true; U.pinOk.clear(); closeModal(); render(); toast('Parental lock is on'); }); }
const PACKS={starter:{pr:99,c:600},popular:{pr:199,c:1300},value:{pr:499,c:3500},binge:{pr:999,c:7500},mega:{pr:1999,c:16000}};
function buyModal(pid){ const p=PACKS[pid]; const base=(pid==='starter'&&U.firstPack)?p.c*2:p.c; const webBonus=Math.round(base*0.10);
 openModal(`<div class="mh"><h2>Pay ₹${p.pr} by UPI</h2><button class="x" data-act="mclose"><svg class="ic s"><use href="#i-x"/></svg></button></div><div class="mb">
 <p class="d">You\u2019ll get <b style="color:var(--text)">${fmt(base)} coins</b> + <b style="color:var(--coin)">${fmt(webBonus)} web bonus</b>. GST invoice by email.</p>
 <div class="upi"><div class="qr"><svg viewBox="0 0 29 29" width="150" height="150" shape-rendering="crispEdges" aria-label="UPI QR"><path fill="#000" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM22 0h7v7h-7zM23 1v5h5V1zM24 2h3v3h-3zM0 22h7v7H0zM1 23v5h5v-5zM2 24h3v3H2zM9 0h2v2H9zM12 0h1v3h-1zM14 1h3v1h-3zM18 0h2v2h-2zM9 3h1v2H9zM11 3h2v1h-2zM15 3h1v2h-1zM17 3h3v1h-3zM8 8h2v2H8zM11 8h3v1h-3zM15 8h1v2h-1zM17 9h2v2h-2zM20 8h1v3h-1zM0 9h2v1H0zM3 9h1v2H3zM5 10h2v1H5zM23 9h1v2h-1zM25 8h2v2h-2zM28 10h1v2h-1zM9 11h1v3H9zM11 12h2v2h-2zM14 11h2v1h-2zM17 12h1v2h-1zM19 13h2v1h-2zM0 13h1v2H0zM2 12h2v1H2zM4 14h3v1H4zM22 12h2v2h-2zM25 12h1v3h-1zM27 13h2v1h-2zM8 15h2v2H8zM11 16h1v2h-1zM13 15h2v1h-2zM16 16h2v1h-2zM19 15h2v2h-2zM0 17h2v2H0zM3 17h3v1H3zM22 16h2v2h-2zM25 17h1v2h-1zM27 16h2v2h-2zM9 19h2v1H9zM12 19h2v2h-2zM15 19h1v3h-1zM17 20h2v1h-2zM20 19h1v2h-1zM9 22h1v2H9zM11 23h3v1h-3zM15 23h2v2h-2zM18 22h2v2h-2zM21 23h1v2h-1zM23 22h2v1h-2zM26 22h3v1h-3zM9 26h2v2H9zM12 25h1v3h-1zM14 26h2v1h-2zM17 25h2v2h-2zM20 26h1v3h-1zM22 25h2v2h-2zM25 25h1v2h-1zM27 26h2v2h-2z"/></svg></div>
 <div class="upiapps"><button data-act="pay" data-p="${pid}"><span class="logo" style="background:#5F259F">₹</span>PhonePe</button><button data-act="pay" data-p="${pid}"><span class="logo" style="background:#1A73E8">G</span>Google Pay</button><button data-act="pay" data-p="${pid}"><span class="logo" style="background:#00BAF2">P</span>Paytm</button><div style="font-size:12px;color:var(--text3);text-align:center">or pay to <b style="color:var(--text2)">katha@icici</b></div><button class="btn s sm" data-act="pay" data-p="${pid}" style="width:100%">I\u2019ve paid — verify</button></div></div></div>`); }
function payingModal(pid){ openModal(`<div class="mb paying" style="padding-top:30px"><div class="spinner"></div><b>Waiting for UPI confirmation…</b><p class="d" style="margin-top:6px">Approve the request in your UPI app. Usually under 10 seconds.</p></div>`);
 setTimeout(()=>{ const p=PACKS[pid]; const base=(pid==='starter'&&U.firstPack)?p.c*2:p.c; const webBonus=Math.round(base*0.10);
  U.coins.b+=base; U.coins.n+=webBonus; if(pid==='starter') U.firstPack=false;
  ledger('Coin pack · web UPI',`₹${p.pr} · ${pid} · order KW-${Math.floor(1e5+Math.random()*9e5)}`,base+webBonus);
  openModal(`<div class="mb success" style="text-align:center;padding-top:30px"><div class="ring"><svg class="ic" style="width:34px;height:34px"><use href="#i-check"/></svg></div><h2 style="font-size:20px;margin:0 0 6px">${fmt(base+webBonus)} coins added</h2><p class="d">Balance ${fmt(bal())} · invoice emailed · works on your iPhone too</p>${U.pending?`<button class="btn p" style="width:100%" data-act="resume-pending">Continue E${U.pending.n} of ${esc(byId(U.pending.s).t)}</button>`:`<button class="btn p" style="width:100%" data-act="mclose">Done</button>`}</div>`);
  updateNav(); },1500); }

/* ============================ actions ============================ */
function act(name,d,el){ d=d||{}; switch(name){
 case 'toast': toast(d.msg); break;
 case 'go': if(d.pend&&PL.s){ U.pending={s:PL.s.id,n:PL.n}; } closeModal(); location.hash=d.to; break;
 case 'mclose': closeModal(); break;
 case 'scroll': { const sc=el.parentElement.querySelector('.scroller'); sc.scrollBy({left:(+d.d)*sc.clientWidth*0.85,behavior:'smooth'}); break; }
 case 'search-open': $('#searchbar').classList.add('on'); $('#searchbtn').style.display='none'; $('#q').focus(); break;
 case 'search-close': $('#searchbar').classList.remove('on'); $('#searchbtn').style.display=''; if(route().v==='search') location.hash='#/'; break;
 case 'searchq': $('#q').value=d.q; location.hash='#/search/'+encodeURIComponent(d.q); break;
 case 'browse': location.hash='#/browse/'+encodeURIComponent(d.f); break;
 case 'play': { const s=byId(d.s); const p=U.progress[s.id]; location.hash=`#/watch/${s.id}/${p?p.n:1}`; break; }
 case 'watch': PL.sheet=false; location.hash=`#/watch/${d.s}/${d.n}`; if(route().v==='watch'&&PL.s&&PL.s.id===d.s&&PL.n===+d.n) render(); break;
 case 'list': { const s=byId(d.s); if(U.list.has(s.id)){ U.list.delete(s.id); toast('Removed from your list'); } else { U.list.add(s.id); toast('Added to your list'); } render(); break; }
 case 'remind': toast('We\u2019ll remind you on Friday at 8 pm'); break;
 case 'lang': { U.langs.has(d.l)?U.langs.delete(d.l):U.langs.add(d.l); render(); break; }
 case 'set': U.settings[d.k]=!U.settings[d.k]; render(); break;
 case 'lock-toggle': if(U.settings.lock){ U.settings.lock=false; U.settings.pin=''; render(); toast('Parental lock is off'); } else setPinModal(); break;
 case 'signin': if(d.pend&&PL.s){ U.pending={s:PL.s.id,n:PL.n}; } signinModal(!!d.pend); break;
 case 'otp': U.phone=$('#ph').value.trim()||'+91 98765 43210'; otpModal(!!d.pend); break;
 case 'verify': { const code=[0,1,2,3].map(i=>$('#o'+i).value).join(''); if(code.length<4){ toast('Enter the 4-digit code'); return; }
   U.signed=true; U.name='Meera'; closeModal(); updateNav(); toast('Signed in as '+U.phone);
   if(U.pending){ const p=U.pending; if(bal()>=byId(p.s).price){} location.hash=`#/watch/${p.s}/${p.n}`; if(route().v==='watch') render(); } else render(); break; }
 case 'signout': Object.assign(U,{signed:false,name:'',phone:''}); render(); toast('Signed out'); break;
 case 'buy': if(!U.signed){ signinModal(); toast('Sign in first — takes 10 seconds'); break; } buyModal(d.p); break;
 case 'pay': payingModal(d.p); break;
 case 'resume-pending': { const p=U.pending; U.pending=null; closeModal(); location.hash=`#/watch/${p.s}/${p.n}`; if(route().v==='watch') render(); break; }
 case 'unlock': { const s=byId(d.s); if(bal()<s.price){ toast('Not enough coins'); break; } spend(s.price); (U.unlocked[s.id]=U.unlocked[s.id]||new Set()).add(+d.n); ledger(`Unlocked ${s.t} E${d.n}`,'episode',-s.price); updateNav(); PL.over='unlocked'; drawPlayer(); setTimeout(()=>{ PL.over=null; PL.playing=true; PL.t=0; drawPlayer(); },1000); break; }
 case 'bundle': { const s=byId(d.s); const remaining=eps(s).filter(x=>!access(s,x.n)).length; const cost=Math.round(remaining*s.price*0.75);
   if(!U.signed){ if(PL.s){U.pending={s:s.id,n:PL.n};} signinModal(true); break; }
   if(bal()<cost){ if(PL.s){U.pending={s:s.id,n:PL.n};} toast(`You need ${fmt(cost-bal())} more coins`); location.hash='#/coins'; break; }
   spend(cost); U.unlocked[s.id]='all'; ledger(`Unlocked all of ${s.t}`,`${remaining} episodes · −25%`,-cost); updateNav();
   if(PL.s&&PL.s.id===s.id){ PL.over='unlocked'; drawPlayer(); setTimeout(()=>{ PL.over=null; PL.playing=true; PL.t=0; drawPlayer(); },1000); } else { render(); toast(`All episodes unlocked · −${fmt(cost)} coins`); } break; }
 /* player */
 case 'pback': history.length>1?history.back():(location.hash='#/series/'+PL.s.id); break;
 case 'pp': if(PL.over) break; PL.playing=!PL.playing; if(PL.t>=PL.dur) PL.t=0; drawPlayer(); break;
 case 'cc': PL.cc=!PL.cc; drawPlayer(); break;
 case 'mute': PL.mut=!PL.mut; drawPlayer(); break;
 case 'like': { const k=PL.s.id+PL.n; U.likes.has(k)?U.likes.delete(k):U.likes.add(k); drawPlayer(); break; }
 case 'sheet': PL.sheet=!PL.sheet; drawPlayer(); break;
 case 'speed': toast('Speed: 1× · 1.5× · 2× in the app'); break;
 case 'seek': { const r=el.getBoundingClientRect(); const x=(d.clientX-r.left)/r.width; PL.t=Math.max(0,Math.min(PL.dur-0.5,x*PL.dur)); if(PL.over&&PL.over!=='paywall'){ PL.over=null; } PL.playing=PL.playing&&!PL.over; drawPlayer(); break; }
 case 'gonext': go(PL.n+1); break;
 case 'gonextbtn': { const nx=PL.n+1; if(nx>PL.s.total){ toast('This is the last episode'); break; } if(access(PL.s,nx)) go(nx); else { saveProgress(); location.hash=`#/watch/${PL.s.id}/${nx}`; } break; }
 case 'cancelnext': clearInterval(PL.cd); PL.over='nextman'; drawPlayer(); break;
 case 'replay': PL.over=null; PL.t=0; PL.playing=true; drawPlayer(); break;
} }
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=el.getAttribute('data-act');
 if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href').startsWith('#/')&&a==='go') return;
 e.preventDefault(); const d=Object.assign({},el.dataset); if(a==='seek') d.clientX=e.clientX; act(a,d,el); });
document.addEventListener('keydown',e=>{ const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'){ if(e.key==='Enter'&&e.target.id==='q'){ location.hash='#/search/'+encodeURIComponent(e.target.value.trim()); } if(e.key==='Escape') closeModal(); return; }
 if(e.key==='Escape'){ if(modal.classList.contains('on')) closeModal(); else if(PL.sheet){ PL.sheet=false; drawPlayer(); } else if(pp.classList.contains('on')) act('pback'); return; }
 if(!pp.classList.contains('on')||modal.classList.contains('on')) return;
 if(e.key===' '){ e.preventDefault(); act('pp'); } else if(e.key==='ArrowRight'){ PL.t=Math.min(PL.dur-0.5,PL.t+5); tickUI(); } else if(e.key==='ArrowLeft'){ PL.t=Math.max(0,PL.t-5); tickUI(); } else if(e.key.toLowerCase()==='c'){ act('cc'); } else if(e.key.toLowerCase()==='e'){ act('sheet'); } });
$('#q').addEventListener('input',()=>{ /* live nav on submit only */ });

/* enter/space on ep rows */
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('ep')){ e.preventDefault(); act('watch',e.target.dataset); } });

if(!location.hash) location.hash='#/';
render();
})();
</script>
</body>
</html>
