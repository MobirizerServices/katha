<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katha Admin — v0.2</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface2:#FAFAFC; --line:#E3E5EB; --line2:#EEF0F4;
  --text:#15161B; --text2:#5F6471; --text3:#8B909C; --inv:#FFFFFF;
  --accent:#E04A2B; --accent-h:#C93E22; --accent-soft:#FDECE7;
  --coin:#A9780A; --coin-soft:#FBF3DA; --ok:#1E9E5A; --ok-soft:#E4F5EB; --warn:#B7690A; --warn-soft:#FBF0DC;
  --danger:#D14343; --danger-soft:#FBE7E7; --info:#2B6FDE; --info-soft:#E6EEFC;
  --side:#0B0B0F; --side2:#16161D; --side3:#1F1F28; --sidetext:#CFD1D8;
  --r:10px; --r-sm:7px; --shadow:0 12px 40px rgba(20,22,40,.14);
  --pad-y:10px; --row-h:44px; --font:14px;
}
[data-theme="dark"]{
  --bg:#0F1014; --surface:#16171D; --surface2:#1B1C23; --line:#262832; --line2:#1F2028;
  --text:#F2F3F6; --text2:#A5A9B4; --text3:#767B87; --inv:#15161B;
  --accent:#FF6A4A; --accent-h:#FF7F63; --accent-soft:rgba(255,106,74,.16);
  --coin:#F5C042; --coin-soft:rgba(245,192,66,.14); --ok:#3CCB7F; --ok-soft:rgba(60,203,127,.14); --warn:#E5A03A; --warn-soft:rgba(229,160,58,.14);
  --danger:#FF6B6B; --danger-soft:rgba(255,107,107,.14); --info:#6C9DFF; --info-soft:rgba(108,157,255,.14);
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
[data-density="compact"]{--pad-y:6px;--row-h:36px;--font:13px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:var(--font)/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.skip{position:absolute;left:-9999px;top:12px;z-index:200;background:var(--surface);padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
.skip:focus{left:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside.side{background:var(--side);color:var(--sidetext);padding:14px 12px 20px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:16px;letter-spacing:-.02em;padding:4px 6px 14px;white-space:nowrap;text-decoration:none}
.brand .env{margin-left:auto;font-size:10px;font-weight:600;color:#F5C042;background:var(--side3);border-radius:6px;padding:3px 6px}
.grp{font-size:11px;color:#6B6B75;padding:12px 10px 4px}
.navi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--sidetext);cursor:pointer;font-size:14px;border:0;background:none;width:100%;text-align:left;text-decoration:none}
.navi:hover{background:var(--side2);color:#fff}
.navi.on{background:var(--side3);color:#fff}
.navi .cnt{margin-left:auto;font-size:11px;font-weight:600;background:#2A2A33;color:#fff;border-radius:999px;padding:1px 7px}
.navi .cnt.w{background:#B7690A} .navi .cnt.d{background:#D14343}
.navi.lock{opacity:.45}
.navi .kb{margin-left:auto;font-size:10px;color:#6B6B75;border:1px solid #2A2A33;border-radius:4px;padding:0 4px}
.navi.lock .kb{display:none}
.me{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--side3);display:grid;grid-template-columns:30px 1fr;gap:6px 10px;font-size:13px;align-items:center}
.me .av{width:30px;height:30px;border-radius:50%;background:#3B1F2B;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.me select{grid-column:1/-1;background:var(--side3);color:#fff;border:0;border-radius:6px;padding:6px 8px;font-size:12px;width:100%}
main{min-width:0}
.topbar{height:58px;display:flex;align-items:center;gap:10px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--text3);cursor:text}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text3);background:var(--surface);font-family:inherit}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--text2);background:var(--surface)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.iconbtn:hover{background:var(--bg)}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;line-height:16px}
.content{padding:20px 24px 72px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.danger{background:var(--danger-soft);color:var(--danger)} .banner.info{background:var(--info-soft);color:var(--info)}
.banner .sp{flex:1}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:22px;margin:0;letter-spacing:-.015em;font-weight:700;display:flex;align-items:center;gap:10px}
.ph p{margin:4px 0 0;color:var(--text2)}
.crumbs{font-size:13px;color:var(--text2);margin-bottom:6px}
.crumbs a{color:var(--text2);text-decoration:none} .crumbs a:hover{color:var(--text)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}

/* ============ components ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13px;cursor:pointer;background:var(--surface);color:var(--text);white-space:nowrap;position:relative}
.btn.p{background:var(--accent);color:#fff} .btn.p:hover{background:var(--accent-h)}
.btn.s{border-color:var(--line)} .btn.s:hover{background:var(--bg)}
.btn.g{background:var(--ok);color:#fff}
.btn.d{background:var(--danger-soft);color:var(--danger);border-color:transparent} .btn.d:hover{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;color:var(--text2)} .btn.ghost:hover{background:var(--bg);color:var(--text)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.loading{color:transparent!important} .btn.loading::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
.btn.s.loading::after,.btn.ghost.loading::after{border-color:var(--line);border-top-color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2)}
.fld>span{display:flex;justify-content:space-between}
.fld input,.fld select,.fld textarea{font:inherit;font-size:14px;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--danger)}
.fld .hint{font-size:12px;color:var(--text3)} .fld .error{font-size:12px;color:var(--danger)}
.fld textarea{min-height:72px;resize:vertical}
.inline-edit{border:1px solid transparent;border-radius:6px;padding:2px 6px;margin:-2px -6px;cursor:text;min-width:60px}
.inline-edit:hover{border-color:var(--line);background:var(--surface2)}
.inline-edit input{font:inherit;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;width:100%;background:var(--surface);color:var(--text)}
.tog{width:38px;height:22px;border-radius:12px;background:#C9CCD6;position:relative;border:0;cursor:pointer;flex:none;padding:0}
[data-theme="dark"] .tog{background:#3A3D4A}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.tog[aria-checked="true"]{background:var(--ok)} .tog[aria-checked="true"]::after{left:18px}
.tog[disabled]{opacity:.45;cursor:not-allowed}
.st{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.st-draft{background:var(--line2);color:var(--text2)} .st-qc{background:var(--warn-soft);color:var(--warn)} .st-sched{background:var(--info-soft);color:var(--info)} .st-live{background:var(--ok-soft);color:var(--ok)} .st-arch{background:var(--line2);color:var(--text3)} .st-down{background:var(--danger-soft);color:var(--danger)} .st-run{background:var(--info-soft);color:var(--info)} .st-wait{background:var(--coin-soft);color:var(--coin)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--text2)}
.tag.a{background:var(--accent-soft);color:var(--accent)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.d{background:var(--danger-soft);color:var(--danger)} .tag.o{background:var(--ok-soft);color:var(--ok)} .tag.i{background:var(--info-soft);color:var(--info)} .tag.c{background:var(--coin-soft);color:var(--coin)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;color:var(--text2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.chip b{font-weight:600;color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;position:relative}
.kpi .l{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .dl{font-size:12px;margin-top:4px;color:var(--text2)}
.kpi svg.spark{position:absolute;right:14px;top:14px;width:64px;height:24px}
.up{color:var(--ok)} .down{color:var(--danger)}
.tipbtn{border:0;background:none;padding:0;width:16px;height:16px;border-radius:50%;color:var(--text3);display:inline-flex;align-items:center;justify-content:center;cursor:help;font-size:11px;border:1px solid var(--line)}
.tooltip{position:fixed;z-index:120;max-width:300px;background:var(--text);color:var(--inv);font-size:12px;line-height:1.4;padding:8px 10px;border-radius:8px;box-shadow:var(--shadow);pointer-events:none;display:none}
.tooltip.on{display:block}
[data-theme="dark"] .tooltip{background:#F2F3F6;color:#15161B}
.grid{display:grid;gap:16px;margin-top:16px}
.g21{grid-template-columns:2fr 1fr} .g12{grid-template-columns:1fr 2fr} .g11{grid-template-columns:1fr 1fr} .g111{grid-template-columns:1fr 1fr 1fr} .g31{grid-template-columns:3fr 1fr}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h3{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.panel>h3 .sub{font-weight:400;color:var(--text2);font-size:12px}
.pad{padding:16px}
.tablewrap{overflow:auto;max-height:620px;border-radius:0 0 var(--r) var(--r)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--font)}
table.t th{text-align:left;font-weight:500;color:var(--text2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;background:var(--surface2);position:sticky;top:0;z-index:2}
table.t th.sortable{cursor:pointer;user-select:none} table.t th.sortable:hover{color:var(--text)}
table.t th .arr{opacity:.5;margin-left:4px}
table.t td{padding:var(--pad-y) 12px;border-bottom:1px solid var(--line2);vertical-align:middle;height:var(--row-h)}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.link{cursor:pointer} table.t tbody tr.link:hover td{background:var(--surface2)}
table.t tr.sel td{background:var(--accent-soft)}
table.t tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--ok-soft)}100%{background:transparent}}
.num{font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--text2)} .tiny{font-size:12px;color:var(--text3)}
.cell{display:flex;align-items:center;gap:10px;min-width:0}
.cell .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cell .ss{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{width:34px;height:48px;border-radius:6px;background:linear-gradient(160deg,var(--c1),var(--c2));flex:none}
[data-density="compact"] .pos{width:26px;height:36px}
.cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.bulk{position:sticky;bottom:16px;z-index:15;margin:16px auto 0;width:max-content;max-width:100%;background:var(--text);color:var(--inv);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);font-size:13px}
.bulk .btn{height:30px;font-size:12px;background:rgba(255,255,255,.12);color:var(--inv);border-color:transparent}
.bulk .btn:hover{background:rgba(255,255,255,.22)}
.bulk .btn.d{background:rgba(255,107,107,.25)}
[data-theme="dark"] .bulk .btn{background:rgba(0,0,0,.12)} [data-theme="dark"] .bulk .btn:hover{background:rgba(0,0,0,.24)}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--text2)}
.pager .sp{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .search{flex:none;max-width:300px;width:300px;padding:6px 10px}
.filters .search input{border:0;background:none;flex:1;font:inherit;color:var(--text);outline:none;min-width:0}
.pop{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;min-width:200px;display:none}
.pop.on{display:block}
.pop label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer} .pop label:hover{background:var(--bg)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs [role="tab"]{padding:10px 0;color:var(--text2);cursor:pointer;border:0;border-bottom:2px solid transparent;background:none;font-weight:500;font-size:14px}
.tabs [role="tab"][aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.stepper{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;background:var(--surface)}
.step .n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--line2);color:var(--text2)}
.step.done{border-color:var(--ok);color:var(--ok)} .step.done .n{background:var(--ok);color:#fff}
.step.cur{border-color:var(--accent);color:var(--text)} .step.cur .n{background:var(--accent);color:#fff}
.step.block{border-color:var(--danger);color:var(--danger)} .step.block .n{background:var(--danger);color:#fff}
.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
.alert:hover{background:var(--surface2)} .alert:last-child{border-bottom:0}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert b{display:block} .alert .when{margin-left:auto;color:var(--text3);white-space:nowrap;font-size:12px}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:60px} .bar i{display:block;height:100%;background:var(--accent)} .bar.ok i{background:var(--ok)} .bar.info i{background:var(--info)}
.stages{display:flex;gap:3px;align-items:center} .stages i{width:16px;height:6px;border-radius:3px;background:var(--line2)} .stages i.done{background:var(--ok)} .stages i.cur{background:var(--accent)} .stages i.err{background:var(--danger)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px} .kv dt{color:var(--text2)} .kv dd{margin:0}
.skl{background:linear-gradient(90deg,var(--line2) 0%,var(--line) 50%,var(--line2) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 24px;color:var(--text2)} .empty .ico{width:44px;height:44px;margin:0 auto 12px;color:var(--text3)} .empty h4{margin:0 0 6px;color:var(--text);font-size:15px} .empty p{margin:0 0 14px;font-size:13px}
.errstate{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--danger-soft);border-radius:8px;color:var(--danger);font-size:13px;margin:16px} .errstate b{display:block;color:var(--danger)} .errstate .btn{margin-left:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:8px;min-height:120px;font-size:12px}
.day.over{border-color:var(--accent);background:var(--accent-soft)}
.day b{display:block;color:var(--text2);font-weight:500;margin-bottom:6px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;margin-top:4px;line-height:1.3;cursor:grab;display:flex;gap:6px;align-items:flex-start}
.ev.ta{border-left:3px solid var(--accent)} .ev.te{border-left:3px solid var(--info)} .ev.tm{border-left:3px solid var(--ok)}
.ev.dragging{opacity:.4}
.day .warn{color:var(--warn);font-size:11px;margin-top:6px;display:flex;gap:4px;align-items:center}
.bench{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bench .b{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px} .bench .b .n{font-size:26px;font-weight:700;letter-spacing:-.02em} .bench .b.low{border-color:var(--warn)}
/* moderation scrubber */
.review{display:grid;grid-template-columns:220px 1fr;gap:16px}
.player{aspect-ratio:9/16;border-radius:14px;position:relative;overflow:hidden;background:#000;color:#fff;max-height:420px}
.player .scene{position:absolute;inset:0;background:radial-gradient(75% 55% at 38% 34%,#8A4A2F 0%,#41211A 42%,#0B0B0F 100%)}
.player .tc{position:absolute;left:10px;bottom:10px;font-size:11px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px;font-family:ui-monospace,Menlo,monospace}
.player .flagchip{position:absolute;top:10px;left:10px;right:10px;font-size:12px;background:rgba(209,67,67,.85);padding:6px 8px;border-radius:6px}
.player .warnov{position:absolute;left:0;right:0;bottom:44px;background:rgba(0,0,0,.72);font-size:10px;padding:6px 8px;text-align:center;letter-spacing:.02em}
.timeline{position:relative;height:36px;margin:12px 0 4px}
.timeline .track{position:absolute;left:0;right:0;top:16px;height:4px;border-radius:2px;background:var(--line)}
.timeline .prog{position:absolute;left:0;top:16px;height:4px;border-radius:2px;background:var(--accent)}

 <div class="panel"><h3>Admin users <span class="sub">14</span></h3>${table({id:'admins',cols:[{key:'p',label:'Person',render:r=>`<div class="tt">${r[0]}</div><div class="tiny">${r[1]}</div>`},{key:'r',label:'Role',render:r=>r[2]},{key:'l',label:'Last sign-in',render:r=>r[3]}],rows:[['Riya Menon','riya@katha.example','Content Ops','Now'],['Arjun Rao','arjun@katha.example','QC / Moderator','08:52'],['Farah Khan','farah@katha.example','Support','08:40'],['Devika Iyer','devika@katha.example','Finance','Yesterday'],['Sameer Joshi','sameer@katha.example','Admin','Yesterday'],['Second Rodeo (partner)','Upload-only · expires Dec 31','Partner upload','Sep 12']].map((r,i)=>Object.assign({id:i},r))})}<div class="pad" style="border-top:1px solid var(--line)"><div class="tiny">Sessions 8 h · re-auth for money and takedown · IP allowlist + Cloudflare Access · all mutations audited</div></div></div></div>`;

V.components=()=>header('Components','The admin\u2019s design system: tokens, components, states. Everything on this page is live and the same CSS the modules use.')+
 `<div class="docs">
 <section><h2>Tokens</h2><p class="d">Light and dark themes share one token set; density changes row height and type size only. Status colours always pair with text or an icon, never colour alone.</p><div class="swatches">${[['--accent','Primary action, progress, current'],['--coin','Anything about money'],['--ok','Success, live, matched'],['--warn','Needs attention, pending'],['--danger','Error, stuck, statutory'],['--info','Scheduled, running, informational'],['--surface','Panels'],['--bg','Workspace']].map(t=>`<div class="sw"><i style="background:var(${t[0]})"></i><b class="mono">${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></section>
 <section><h2>Buttons</h2><p class="d">One primary per view. Destructive actions use the danger style and always confirm. Loading replaces the label, never adds a second spinner.</p><div class="demo"><button class="btn p">Primary</button><button class="btn s">Secondary</button><button class="btn ghost">Ghost</button><button class="btn g">Approve</button><button class="btn d">Destructive</button><button class="btn p loading">Loading</button><button class="btn p" disabled title="Why it\u2019s disabled goes in the title">Disabled</button><button class="btn s sm">Small</button></div></section>
 <section><h2>Status, tags and chips</h2><p class="d">Status chips are for lifecycle states; tags for attributes; chips for filters (selected = accent tint + border).</p><div class="demo">${Object.keys(STATUS).map(st).join('')}<span class="tag">tag</span><span class="tag a">accent</span><span class="tag w">warn</span><span class="tag d">danger</span><span class="tag o">ok</span><span class="tag i">info</span><span class="tag c">coin</span><button class="chip">Filter</button><button class="chip on">Selected</button></div></section>
 <section><h2>Form fields</h2><p class="d">Label above, hint or error below, one column in drawers and two in modals. Inline edit is for single values inside tables and saves on blur.</p><div class="demo" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><label class="fld">Title<input value="Kaanch Ka Mahal"><span class="hint">Shown in the app exactly as typed.</span></label><label class="fld err">Coins per episode<input value="3"><span class="error">Minimum 5 coins.</span></label><label class="fld">Language<select><option>Hindi</option></select></label><div class="fld">Toggle<div style="display:flex;gap:10px;align-items:center;margin-top:6px"><button class="tog" role="switch" aria-checked="true" data-act="demo-tog"></button><button class="tog" role="switch" aria-checked="false" data-act="demo-tog"></button><button class="tog" role="switch" aria-checked="false" disabled></button></div></div><div class="fld">Inline edit<div class="inline-edit" style="margin-top:8px;display:inline-block" data-act="edit-demo">Click to edit</div></div></div></section>
 <section><h2>Table states</h2><p class="d">Sticky header, sortable columns with a definition tip, checkbox selection with shift-click ranges, skeleton while loading, an empty state that says what to do, and an error state with retry.</p><div class="grid g111" style="margin-top:8px"><div class="panel">${table({id:'demo1',cols:[{key:'a',label:'Loading',render:r=>r.a},{key:'b',label:'Value',num:true,metric:'cliff',render:r=>r.b}],rows:[],loading:true})}</div><div class="panel">${table({id:'demo2',cols:[{key:'a',label:'Empty',render:r=>r.a}],rows:[],empty:emptyState('No results','Clear a filter or widen the date range.','<button class="btn s sm">Clear filters</button>')})}</div><div class="panel">${errState('Couldn\u2019t load','The service returned 503. Nothing was changed.','demo-retry')}</div></div></section>
 <section><h2>Overlays and feedback</h2><p class="d">Drawers for detail (focus-trapped, Esc closes, focus returns). Modals for decisions. Confirmations for destructive or money actions include a reason and, when irreversible, typed confirmation. Toasts confirm what changed in the same words as the button, with Undo where possible.</p><div class="demo"><button class="btn s" data-act="demo-drawer">Open a drawer</button><button class="btn s" data-act="demo-confirm">Open a confirmation</button><button class="btn s" data-act="demo-toast">Toast with undo</button><button class="btn s" data-act="demo-banner">Show banners</button><span data-tip="Tooltips explain; they never hold the only copy of anything important." class="tag">Hover for a tooltip</span></div><div id="demo-banners" style="margin-top:10px;display:none"><div class="banner info"><svg class="ic s"><use href="#i-warn"/></svg>Read-only preview: you are viewing as Analyst.</div><div class="banner warn"><svg class="ic s"><use href="#i-warn"/></svg>Your session expires in 5 minutes.<span class="sp"></span><button class="btn s sm">Stay signed in</button></div><div class="banner danger"><svg class="ic s"><use href="#i-wifioff"/></svg>You\u2019re offline. Changes will fail until the connection returns.</div></div></section>
 <section><h2>Keyboard</h2><p class="d">Every module is reachable by <span class="kbd">g</span> + letter, the palette by <span class="kbd">⌘K</span>, and lists by <span class="kbd">j</span>/<span class="kbd">k</span> where it matters. Press <span class="kbd">?</span> anywhere for the full list.</p></section></div>`;

V.denied=(v)=>`<div class="denied"><svg class="ico ic"><use href="#i-lock"/></svg><h2 style="margin:0 0 6px">${ROLE_NAMES[S.role]} can\u2019t open ${esc(v)}</h2><p class="muted">Access is granted by role through Google Workspace groups. Ask an Admin, or request access and they\u2019ll be notified.</p><div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><a class="btn s" href="#/overview">Back to overview</a><button class="btn p" data-act="toast" data-msg="Access request sent to Admins with your reason">Request access</button></div></div>`;

/* ============================================================ shell, router, render ============================================================ */
const content=$('#content'), side=$('#side');
function renderSide(){ side.innerHTML=`<a class="brand" href="#/overview"><svg width="26" height="26"><use href="#i-app"/></svg>Katha Admin<span class="env">Production</span></a>${NAV.map(g=>`<div class="grp">${g[0]}</div>${g[1].map(n=>{const cnt=n[4]?n[4]():null;const ok=can(n[0]);return `<a class="navi ${S.route.view===n[0]||(S.route.view==='series'&&n[0]==='catalog')?'on':''} ${ok?'':'lock'}" href="#/${n[0]}" data-view="${n[0]}"><svg class="ic" style="width:18px;height:18px"><use href="#${n[2]}"/></svg>${n[1]}${cnt?`<span class="cnt ${n[5]||''}">${cnt}</span>`:(n[3]?`<span class="kb">${n[3]}</span>`:'')}</a>`;}).join('')}`).join('')}<div class="me"><div class="av">R</div><div><div style="color:#fff;font-weight:600">Riya Menon</div><div class="tiny" style="color:#8B909C">${ROLE_NAMES[S.role]}</div></div><select id="role" aria-label="Preview as role">${Object.entries(ROLE_NAMES).map(([k,v])=>`<option value="${k}" ${k===S.role?'selected':''}>Preview as ${v}</option>`).join('')}</select></div>`;
  $('#role').addEventListener('change',e=>{ S.role=e.target.value; toast('Previewing as '+ROLE_NAMES[S.role]); render(); }); }
function parse(){ const h=(location.hash||'#/overview').replace(/^#\/?/,''); const p=h.split('/'); let view=p[0]||'overview', id=p[1]||null, sub=p[2]||null; if(view==='catalog'&&id){ view='series'; } return {view,id,sub}; }
function render(){ S.route=parse(); const {view,id,sub}=S.route; renderSide(); $$('.pop.on').forEach(p=>p.classList.remove('on'));
  const guardView=view==='series'?'catalog':view;
  let html=''; if(S.offline) html+=`<div class="banner danger"><svg class="ic s"><use href="#i-wifioff"/></svg>You\u2019re offline. Reads are cached; writes will fail until the connection returns.<span class="sp"></span><button class="btn s sm" data-act="offline-toggle">Simulate reconnect</button></div>`;
  if(!can(guardView)) html+=V.denied(NAV.flatMap(g=>g[1]).find(n=>n[0]===guardView)?.[1]||view);
  else if(!V[view]) html+=emptyState('Page not found','Nothing lives at this address.','<a class="btn s sm" href="#/overview">Back to overview</a>');
  else html+=V[view](id,sub);
  content.innerHTML=html; if(!S.loaded[view]){ setTimeout(()=>{ S.loaded[view]=true; if(S.route.view===view) render(); },450); }
  tickSLA(); updateBell(); document.title=`Katha Admin — ${view[0].toUpperCase()+view.slice(1)}`; }
window.addEventListener('hashchange',()=>{ closeDrawer(); render(); window.scrollTo(0,0); });
function rerenderKeepFocus(sel){ const el=document.activeElement, id=el&&el.id, pos=el&&el.selectionStart; render(); const n=id?document.getElementById(id):(sel?$(sel):null); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos);}catch(e){} } }
function tickSLA(){ $$('.sla[data-dl]').forEach(el=>{ const ms=+el.getAttribute('data-dl')-Date.now(); const a=Math.abs(ms); const h=Math.floor(a/3600e3), m=Math.floor((a%3600e3)/60e3), s=Math.floor((a%60e3)/1e3); el.textContent=(ms<0?'Overdue by ':'')+(h>=48?`${Math.floor(h/24)} d`:h?`${h} h ${String(m).padStart(2,'0')} m`:`${m} m ${String(s).padStart(2,'0')} s`); el.classList.toggle('bad',ms<3*3600e3); }); }
setInterval(tickSLA,1000);

function openPalette(){ pal.classList.add('on'); scrim.classList.add('on'); palin.value=''; palFilter(''); palin.focus(); }
function closePalette(){ pal.classList.remove('on'); if(!drawer.classList.contains('open')&&!modal.classList.contains('on')) scrim.classList.remove('on'); }
function palFilter(q){ q=q.trim().toLowerCase(); const all=palAll(); palItems=q?all.filter(i=>(i.g+' '+i.t).toLowerCase().includes(q)).slice(0,14):[...S.recent.slice(0,3).map(r=>({g:'Recent',t:r.t,run:r.run})),...all.filter(i=>i.g==='Go to').slice(0,8),...all.filter(i=>i.g==='Actions').slice(0,4)]; palIdx=0; palRender(); }

let seq='', seqT=0;
document.addEventListener('keydown',e=>{ const tag=(e.target.tagName||'').toLowerCase(); const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); pal.classList.contains('on')?closePalette():openPalette(); return; }
  if(e.key==='Escape'){ if(pal.classList.contains('on')) closePalette(); else if(modal.classList.contains('on')&&!S.session.expired) closeModal(); else closeDrawer(); $$('.pop.on').forEach(p=>p.classList.remove('on')); $('#notif').classList.remove('on'); return; }
  if(typing){ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&e.target.id==='reply'){ act('send-reply',{id:S.ui.support.cur}); } return; }

  if(S.route.view==='moderation'){ const m=MODQ.find(x=>x.id===S.ui.mod.cur)||MODQ[0]; if(m){ if(e.key==='j'){act('mod-flag',{i:Math.min(m.flags.length-1,S.ui.mod.flag+1)});return;} if(e.key==='k'){act('mod-flag',{i:Math.max(0,S.ui.mod.flag-1)});return;} if(e.key==='a'){act('mod-approve');return;} if(e.key==='r'){act('mod-return');return;} if(/^[1-5]$/.test(e.key)){ const r=['U','U/A 7+','U/A 13+','U/A 16+','A'][+e.key-1]; m.r=r; render(); return; } if(e.key==='ArrowRight'){S.ui.mod.t=clamp(S.ui.mod.t+5,0,m.dur);render();return;} if(e.key==='ArrowLeft'){S.ui.mod.t=clamp(S.ui.mod.t-5,0,m.dur);render();return;} } }
  const now=Date.now(); if(e.key==='g'){ seq='g'; seqT=now; return; } if(seq==='g'&&now-seqT<900){ const map={o:'overview',c:'catalog',m:'media',r:'moderation',p:'programming',u:'users',t:'support',a:'approvals',f:'finance',x:'config',n:'analytics'}; if(map[e.key]){ location.hash='#/'+map[e.key]; } seq=''; } });

function act(name,d,el){ d=d||{}; const u=S.ui;
  switch(name){
  case 'toast': toast(d.msg); break;
  case 'go': location.hash=d.to; break;
  case 'modal-close': closeModal(); break;
  case 'reauth': S.session.expired=false; closeModal(); toast('Signed in · session restored'); break;
  case 'offline-toggle': S.offline=!S.offline; render(); break;
  case 'pop': { const p=$('#'+d.pop); const on=p.classList.contains('on'); $$('.pop.on').forEach(x=>x.classList.remove('on')); if(!on) p.classList.add('on'); break; }
  case 'col': u.catalog.cols[d.k]=!u.catalog.cols[d.k]; render(); $('#colpop')&&$('#colpop').classList.add('on'); break;
  case 'cat-lang': u.catalog.lang=d.v; u.catalog.page=1; render(); break;
  case 'cat-status': u.catalog.status=d.v; u.catalog.page=1; render(); break;
  case 'cat-clear': Object.assign(u.catalog,{q:'',lang:'All',status:'All',page:1}); render(); break;
  case 'cat-saved': { const v=u.catalog.saved[+d.i]; Object.assign(u.catalog,v.f,{page:1}); render(); toast('View: '+v.n); break; }
  case 'cat-save': { const n=prompt('Name this view',`${u.catalog.lang} · ${u.catalog.status}`); if(n){ u.catalog.saved.push({n,f:{lang:u.catalog.lang,status:u.catalog.status,q:u.catalog.q}}); render(); toast('Saved view “'+n+'”'); } break; }
  case 'sort': { const c=u.catalog; if(c.sort===d.key) c.dir*=-1; else { c.sort=d.key; c.dir=1; } render(); break; }
  case 'page': u.catalog.page=+d.p; render(); window.scrollTo(0,0); break;
  case 'export-catalog': download('katha-series.csv',['id,title,language,genre,rating,live,total,free,price,status,owner'].concat(catalogRows().map(s=>[s.id,s.t,s.lang,s.g,s.r,s.live,s.total,s.free,s.price,s.s,s.owner].map(csv).join(','))).join('\n')); toast(`Exported ${catalogRows().length} series`); break;
  case 'open-series': location.hash='#/catalog/'+d.id; break;

  case 'new-series': newSeriesModal(); break;
  case 'ns-create': { const t=$('#ns-title').value.trim(), total=+$('#ns-total').value, free=+$('#ns-free').value; let ok=true; $('#f-title').classList.toggle('err',t.length<3); $('#f-title .error').hidden=t.length>=3; if(t.length<3) ok=false; $('#f-free').classList.toggle('err',free>=total); $('#f-free .error').hidden=free<total; if(free>=total) ok=false; if(!ok) return; const id='srs_'+uid(); SERIES.unshift({id,k:PK[SERIES.length%PK.length],t,slug:t.toLowerCase().replace(/[^a-z0-9]+/g,'-'),lang:$('#ns-lang').value,dubs:[],subs:[],g:$('#ns-genre').value,tropes:'',r:'—',desc:'',total,live:0,free,price:+$('#ns-price').value,bundle:25,rel:$('#ns-rel').value,s:'draft',u:Date.now(),owner:$('#ns-owner').value,tier:$('#ns-tier').value[0],cost:0,studio:'—'}); closeModal(); audit(ME,'series.create',t,'draft created'); location.hash='#/catalog/'+id; toast('Draft created · complete the checklist to schedule'); break; }
  case 'schedule': schedulerModal(d.ids.split(','),sById(d.ids.split(',')[0]).t); break;
  case 'schedule-ep': closeDrawer(); schedulerModal([d.sid+':'+d.n],`${sById(d.sid).t} E${d.n}`); break;
  case 'bulk-schedule': { const ids=[...u.catalog.sel]; if(!ids.length){ toast('Select series first'); break; } schedulerModal(ids,`${ids.length} series`); break; }

  case 'bulk-price': { const ids=[...u.catalog.sel]; if(!ids.length){toast('Select series first');break;} openModal(`<h2>Set pricing for ${ids.length} series</h2><div class="mb"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="fld">Free episodes<input id="bp-free" type="number" value="10"></label><label class="fld">Coins per episode<input id="bp-price" type="number" value="30"></label></div><div class="warnbox">Changes over 20% on any selected series go to the Approvals inbox instead of applying immediately.</div></div><div class="mf"><button class="btn s" data-act="modal-close">Cancel</button><button class="btn p" data-act="bp-confirm" data-ids="${ids.join(',')}">Apply</button></div>`); break; }
  case 'bp-confirm': { const ids=d.ids.split(','), free=+$('#bp-free').value, price=+$('#bp-price').value; let applied=0, queued=0; ids.forEach(id=>{ const s=sById(id); if(Math.abs(price-s.price)/s.price>0.2||Math.abs(free-s.free)/Math.max(1,s.free)>0.2){ S.approvals.push({id:'apr_'+uid(),kind:'Price change',detail:`${s.t} · ${s.free}→${free} free · ${s.price}→${price} coins`,by:ME,when:'Just now',needs:'Admin'}); queued++; } else { s.free=free; s.price=price; s.u=Date.now(); applied++; } }); u.catalog.sel.clear(); closeModal(); audit(ME,'pricing.bulk',ids.length+' series',`applied ${applied}, queued ${queued}`); render(); toast(`${applied} applied${queued?` · ${queued} sent to Approvals (over 20%)`:''}`); break; }
  case 'bulk-archive': { const ids=[...u.catalog.sel]; if(!ids.length){toast('Select series first');break;} confirmDialog({title:`Archive ${ids.length} series?`,body:'Archived series disappear from the app and search within minutes. Viewers keep their unlocks. This can be undone from the toast or by publishing again.',label:'Archive',danger:true,reasons:['End of run','Rights expired','Underperforming (kill criteria)','Duplicate'],onConfirm:(reason,note)=>{ const prev=ids.map(id=>[id,sById(id).s]); ids.forEach(id=>{ sById(id).s='arch'; sById(id).u=Date.now(); }); u.catalog.sel.clear(); audit(ME,'series.archive',ids.join(', '),reason+(note?' · '+note:'')); withUndo(`Archived ${ids.length} series`,()=>{},()=>prev.forEach(p=>sById(p[0]).s=p[1])); }}); break; }
  case 'bulk-export': download('katha-selection.csv',['id,title'].concat([...u.catalog.sel].map(id=>sById(id)?[id,csv(sById(id).t)].join(','):id)).join('\n')); toast('Exported selection'); break;
  case 'bulk-clear': u.catalog.sel.clear(); u.media.sel.clear(); render(); break;
  case 'bulk-free': { const s=sById(S.route.id); if(!s) break; const eps=episodesFor(s.id); const prev=[...u.media.sel].map(n=>[n,eps[n-1].free]); prev.forEach(p=>eps[p[0]-1].free=true); u.media.sel.clear(); withUndo(`Marked ${prev.length} episodes free`,()=>{},()=>prev.forEach(p=>eps[p[0]-1].free=p[1])); break; }
  case 'bulk-retry': case 'bulk-priority': { const n=u.media.sel.size; u.media.sel.clear(); render(); toast(`${name==='bulk-retry'?'Retried':'Prioritized'} ${n} assets`); break; }
  case 'unpublish': confirmDialog({title:`Unpublish ${sById(d.id).t}?`,body:'The series returns to QC and disappears from Home and search within minutes. Viewers keep their unlocks and can still play downloaded episodes until the next app launch.',label:'Unpublish',danger:true,reasons:['Content issue found','Rights issue','Scheduling mistake'],onConfirm:(r,n)=>{ const s=sById(d.id), prev=s.s; s.s='qc'; audit(ME,'series.unpublish',s.t,r+(n?' · '+n:'')); withUndo(`Unpublished ${s.t}`,()=>{},()=>{s.s=prev;}); }}); break;
  case 'takedown': { const s=sById(d.id); confirmDialog({title:`Take down ${s.t}?`,body:`<b>This hides ${s.live} live episodes from ${fmtN(4100+s.total*70)} viewers who have unlocked them</b>, purges the CDN and removes the series from the app within minutes. Coins are not refunded automatically. A second approver must confirm within 24 hours or the takedown is escalated to Legal.`,label:'Take down now',danger:true,reasons:['Grievance received (IT Rules)','Legal notice / copyright claim','Rights lapsed','Safety incident','Regulatory direction'],requireText:s.slug,onConfirm:(reason,note)=>{ const prev=s.s; s.s='down'; s.u=Date.now(); S.approvals.push({id:'apr_'+uid(),kind:'Takedown (confirm)',detail:`${s.t} · ${reason}${note?' · '+note:''} · executed by ${ME}`,by:ME,when:'Just now',needs:'Admin (second)'}); audit(ME,'series.takedown',s.t,reason+(note?' · '+note:'')); withUndo(`${s.t} taken down · CDN purge started`,()=>{},()=>{ s.s=prev; S.approvals.pop(); }); }}); break; }
  case 'edit': { if(el.querySelector('input')) return; const cur=el.textContent.trim().replace(/ coins$/,''); el.innerHTML=`<input value="${esc(cur)}" aria-label="Edit ${d.field}">`; const inp=el.querySelector('input'); inp.focus(); inp.select(); const save=()=>{ const v=inp.value.trim(); const e=episodesFor(d.sid)[+d.n-1]; if(d.field==='price'){ const p=parseInt(v,10); if(!(p>=5)){ toast('Minimum 5 coins'); render(); return; } e.price=p; } else e[d.field]=v; e._flash=true; audit(ME,'episode.update',`${sById(d.sid).t} E${d.n}`,`${d.field} → ${v}`); render(); setTimeout(()=>{ e._flash=false; },1600); toast('Saved · audited'); }; inp.addEventListener('blur',save,{once:true}); inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ inp.blur(); } if(ev.key==='Escape'){ inp.removeEventListener('blur',save); render(); } }); break; }
  case 'edit-beat': case 'edit-demo': { if(el.querySelector('input')) return; const cur=el.textContent.trim(); el.innerHTML=`<input value="${esc(cur)}">`; const inp=el.querySelector('input'); inp.focus(); inp.addEventListener('blur',()=>{ el.textContent=inp.value||cur; toast('Saved'); },{once:true}); break; }
  case 'ep-free': { const e=episodesFor(d.sid)[+d.n-1], prev=e.free; e.free=!prev; withUndo(`E${d.n} is now ${e.free?'free':'paid'}`,()=>{},()=>{e.free=prev;}); break; }
  case 'price-calc': { const s=sById(d.id); const free=+($('[data-k="free"]').value), price=+($('[data-k="price"]').value), bundle=+($('[data-k="bundle"]').value); const per=(s.total-free)*price, b=Math.round(per*(1-bundle/100)); $('#pricecalc').innerHTML=`<dt>Free episodes</dt><dd>${free} of ${s.total}</dd><dt>Episode by episode</dt><dd><b>${fmtN(per)} coins</b> ≈ ₹${fmtN(Math.round(per*.15))}</dd><dt>Bundle (−${bundle}%)</dt><dd><b>${fmtN(b)} coins</b> ≈ ₹${fmtN(Math.round(b*.15))}</dd><dt>Popular pack covers</dt><dd>${Math.floor(1300/Math.max(1,price))} episodes</dd><dt>Benchmark</dt><dd>India ceiling ₹150–300 per series</dd>`; break; }
  case 'price-save': { const s=sById(d.id); const free=+($('[data-k="free"]').value), price=+($('[data-k="price"]').value), bundle=+($('[data-k="bundle"]').value); if(Math.abs(price-s.price)/s.price>0.2||Math.abs(free-s.free)/Math.max(1,s.free)>0.2){ S.approvals.push({id:'apr_'+uid(),kind:'Price change',detail:`${s.t} · ${s.free}→${free} free · ${s.price}→${price} coins · bundle ${bundle}%`,by:ME,when:'Just now',needs:'Admin'}); render(); toast('Change over 20% · sent to Approvals'); } else { const prev={free:s.free,price:s.price,bundle:s.bundle}; Object.assign(s,{free,price,bundle,u:Date.now()}); audit(ME,'pricing.update',s.t,`free ${free} · ${price} coins · bundle ${bundle}%`); withUndo('Pricing saved · reaches the app within 5 minutes',()=>{},()=>Object.assign(s,prev)); } break; }
  case 'retry-asset': { const m=MEDIA.find(x=>x.a===d.a); m.err=false; m.stage++; render(); toast('Routed to FFmpeg fallback · ETA 9 min'); break; }
  case 'retry-all': MEDIA.filter(m=>m.err).forEach(m=>{m.err=false;m.stage++;}); render(); toast('Retried failed jobs'); break;
  case 'qc-approve': { if(!$$('.qcck').every(c=>c.checked)){ toast('Tick every QC item first — rating is still unconfirmed'); break; } const m=MEDIA.find(x=>x.a==='ast_9f21'); if(m){ m.stage=7; } withUndo('E59 approved · scheduled Mon 14 · 8 pm · followers notified',()=>{},()=>{ if(m) m.stage=6; }); break; }
  case 'qc-reject': confirmDialog({title:'Reject E59?',body:'The studio gets your notes and a new delivery slot. Nothing changes for viewers.',label:'Send back',danger:true,reasons:['Picture quality','Sound / loudness','Continuity error','Wrong cut delivered'],onConfirm:(r,n)=>{ audit(ME,'asset.reject','Kaanch Ka Mahal E59',r+(n?' · '+n:'')); toast('E59 returned to Second Rodeo with notes'); }}); break;
  case 'mod-pick': u.mod.cur=d.id; u.mod.flag=0; u.mod.t=(MODQ.find(m=>m.id===d.id).flags[0]||{t:0}).t; render(); break;
  case 'mod-flag': { const m=MODQ.find(x=>x.id===u.mod.cur)||MODQ[0]; if(!m.flags.length) break; u.mod.flag=clamp(+d.i,0,m.flags.length-1); u.mod.t=m.flags[u.mod.flag].t; render(); break; }
  case 'mod-seek': u.mod.t=+d.t; render(); break;
  case 'mod-skip': { const i=MODQ.findIndex(x=>x.id===u.mod.cur); const nx=MODQ[(i+1)%MODQ.length]; act('mod-pick',{id:nx.id}); break; }
  case 'mod-approve': { if(!canAct('qc')){ toast(ROLE_NAMES[S.role]+' can\u2019t decide ratings'); break; } const i=MODQ.findIndex(x=>x.id===u.mod.cur); const m=MODQ[i]; if(!m) break; const r=($('input[name="rating"]:checked')||{}).value||m.r; const desc=($('#descs')||{}).value||m.desc.join(', '); const s=sById(m.sid); const prev={r:s.r,desc:s.desc}; s.r=r; s.desc=desc; MODQ.splice(i,1); audit(ME,'moderation.decide',`${s.t} E${m.ep}`,`rated ${r} · ${desc}${m.flags.some(f=>f.stat)?' · statutory warnings attached':''}`); u.mod.cur=(MODQ[i]||MODQ[0]||{}).id; u.mod.flag=0; u.mod.t=MODQ.length?((MODQ.find(x=>x.id===u.mod.cur).flags[0]||{t:0}).t):0; withUndo(`Rated ${s.t} E${m.ep} ${r}${m.flags.some(f=>f.stat)?' · warnings attached':''}`,()=>{},()=>{ MODQ.splice(i,0,m); Object.assign(s,prev); u.mod.cur=m.id; }); break; }
  case 'mod-return': { if(!canAct('qc')){ toast(ROLE_NAMES[S.role]+' can\u2019t decide ratings'); break; } const i=MODQ.findIndex(x=>x.id===u.mod.cur); const m=MODQ[i]; if(!m) break; confirmDialog({title:`Return ${sById(m.sid).t} E${m.ep} to post?`,body:'The episode leaves the queue and goes back to the studio with your flags and notes attached.',label:'Return to post',danger:true,reasons:['Blur third-party logo','Cut or trim a scene','Fix subtitles','Re-deliver master'],onConfirm:(r,n)=>{ MODQ.splice(i,1); u.mod.cur=(MODQ[i]||MODQ[0]||{}).id; u.mod.flag=0; audit(ME,'moderation.return',`${sById(m.sid).t} E${m.ep}`,r+(n?' · '+n:'')); withUndo(`Returned E${m.ep} to post`,()=>{},()=>{ MODQ.splice(i,0,m); u.mod.cur=m.id; }); }}); break; }
  case 'apr-approve': { const i=S.approvals.findIndex(a=>a.id===d.id); const a=S.approvals[i]; if(a.by===ME){ toast('You can\u2019t approve your own request'); break; } S.approvals.splice(i,1); if(a.kind==='Coin adjustment'&&a.user){ const us=USERS.find(x=>x.id===a.user); if(us) us.b+=a.amount; } audit(ME,'approval.approve',a.kind,a.detail); render(); toast(`Approved · ${a.kind} applied and audited`); break; }
  case 'apr-reject': { const i=S.approvals.findIndex(a=>a.id===d.id); const a=S.approvals[i]; confirmDialog({title:`Reject ${a.kind}?`,body:esc(a.detail),label:'Reject',danger:true,onConfirm:(r,n)=>{ S.approvals.splice(i,1); audit(ME,'approval.reject',a.kind,n||'no note'); render(); toast('Rejected · requester notified'); }}); break; }
  case 'brief-pick': u.writers.cur=+d.i; render(); break;
  case 'wr-approve': { const b=BRIEFS[u.writers.cur]; b.stage=Math.min(10,b.stage+1); b.s=['Brief','Signals','Premises','Premise pick','Bible','Outline · approval','Scripts 0/60','Continuity','Compliance','Sign-off','Export'][b.stage]; render(); toast('Outline approved · scripting 60 episodes started (est. 40 min)'); audit(ME,'script_draft.approve',b.t,'outline v3 approved'); break; }
  case 'adjust': closeDrawer(); adjustModal(d.id,d.tk); break;
  case 'adj-confirm': { const amt=+$('#adj-amt').value, dir=$('#adj-dir').value, reason=$('#adj-reason').value, note=$('#adj-note').value; const us=USERS.find(x=>x.id===d.id); closeModal(); if(amt>500){ S.approvals.push({id:'apr_'+uid(),kind:'Coin adjustment',detail:`${dir} ${fmtN(amt)} coins · ${d.id} · ${reason}${d.tk?' · '+d.tk:''}`,by:ME,when:'Just now',amount:dir==='Credit'?amt:-amt,user:d.id,needs:'Finance or Admin'}); render(); toast('Approval requested · Finance notified · nothing written yet'); } else { if(us) us.b+=dir==='Credit'?amt:-amt; audit(ME,'wallet.adjust',d.id,`${dir} ${amt} · ${reason}${note?' · '+note:''}`); render(); toast(`Ledger entry written · ${dir.toLowerCase()} ${amt} coins · idempotency key admin:${uid()}`); } break; }
  case 'macro': { const t=TICKETS.find(x=>x.id===u.support.cur); const us=USERS.find(x=>x.id===t.user); const m=MACROS[el.value]; if(m){ $('#reply').value=m.replace('{name}',us&&us.n!=='—'?us.n.split(' ')[0]:'there').replace('{id}',t.id.replace(/\D/g,'')); $('#reply').focus(); } el.value=''; break; }
  case 'send-reply': { const t=TICKETS.find(x=>x.id===d.id); const v=($('#reply')||{}).value||''; if(!v.trim()){ toast('Write a reply first'); break; } t.thread.push({w:'a',n:`${ME} · now`,m:v}); render(); toast('Reply sent'); break; }
  case 'ack': { const t=TICKETS.find(x=>x.id===d.id); t.steps.ack=true; t.as='Sameer Joshi (Grievance Officer)'; t.thread.push({w:'a',n:`${ME} · now`,m:MACROS['Grievance acknowledgement'].replace('{id}',t.id.replace(/\D/g,''))}); t.dl=Date.now()+14*86400e3; audit(ME,'grievance.acknowledge',t.id,'acknowledged within 24 h · 15-day decision clock started'); render(); toast('Acknowledgement sent · 15-day decision clock started'); break; }
  case 'resolve': { const t=TICKETS.find(x=>x.id===d.id); confirmDialog({title:`Resolve ${t.id}?`,body:'The customer gets a closing message and a satisfaction survey. Reopens automatically if they reply within 7 days.',label:'Resolve',reasons:['Fixed · coins credited','Fixed · refund confirmed','Answered','Duplicate','No response'],onConfirm:(r,n)=>{ const prev=t.st; t.st='Resolved'; audit(ME,'ticket.resolve',t.id,r); withUndo(`${t.id} resolved · ${r}`,()=>{},()=>{t.st=prev;}); }}); break; }
  case 'apple-retry': S.ui.appleErr=false; render(); toast('Apple Sales report loaded · 3 days now pending reconciliation'); break;
  case 'flags-retry': S.ui.flagsErr=false; render(); toast('Config service back · toggles enabled'); break;
  case 'flag': { const f=S.flags[+d.i]; const prev=f[2]; f[2]=!prev; audit(ME,'flag.update',f[0],`${prev?'on':'off'} → ${f[2]?'on':'off'}`); withUndo(`${f[0]} ${f[2]?'on':'off'} · live in ≤ 5 min`,()=>{},()=>{f[2]=prev;}); break; }
  case 'range': u.analytics.range=d.r; render(); break;
  case 'audit-clear': u.audit={actor:'',entity:''}; render(); break;
  case 'audit-export': download('katha-audit.csv',['when,actor,action,entity,change'].concat(S.audit.map(a=>[new Date(a[0]).toISOString(),a[1],a[2],a[3],a[4]].map(csv).join(','))).join('\n')); toast('Audit log exported'); break;
  case 'notif-read': S.notifications.forEach(n=>n.unread=false); renderNotif(); updateBell(); break;
  case 'notif-go': { const n=S.notifications.find(x=>x.id===+d.id); n.unread=false; $('#notif').classList.remove('on'); updateBell(); location.hash=n.go; break; }
  case 'demo-tog': el.setAttribute('aria-checked',el.getAttribute('aria-checked')!=='true'); break;
  case 'demo-drawer': openDrawer('Drawer',`<p class="muted" style="margin:0 0 12px;font-size:13px">Focus is trapped here; Esc closes and returns focus to the button that opened it.</p>${tabs('dd',['Tab one','Tab two'])}${panel('dd',0,'<p>Panels are ARIA tabpanels; arrow keys move between tabs.</p>')}${panel('dd',1,'<p>Second panel.</p>')}`,`<button class="btn s" data-act="close-drawer">Close</button><button class="btn p" data-act="toast" data-msg="Saved">Save</button>`,el); break;
  case 'close-drawer': closeDrawer(); break;
  case 'demo-confirm': confirmDialog({title:'Delete “Sunday Sambar”?',body:'This removes the draft and its 12 uploaded masters. It cannot be undone.',label:'Delete draft',danger:true,requireText:'sunday-sambar',reasons:['Duplicate','Abandoned'],onConfirm:()=>toast('Deleted (demo)')}); break;
  case 'demo-toast': withUndo('Archived 3 series',()=>{},()=>{}); break;
  case 'demo-banner': { const b=$('#demo-banners'); b.style.display=b.style.display==='none'?'':'none'; break; }
  case 'demo-retry': toast('Retried (demo) · loaded'); break;
  } }
function csv(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function download(name,text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

/* ============================================================ event delegation ============================================================ */
document.addEventListener('click',e=>{
  const pop=e.target.closest('.pop'); if(!pop&&!e.target.closest('[data-act="pop"]')) $$('.pop.on').forEach(p=>p.classList.remove('on'));
  if(!e.target.closest('#notif')&&!e.target.closest('#bellbtn')) $('#notif').classList.remove('on');
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; if(el.tagName==='INPUT'&&el.type==='checkbox') return; if(el.tagName==='SELECT'||el.tagName==='INPUT') return;
  if(e.target.closest('input.cb')||e.target.closest('.tog')&&el!==e.target.closest('.tog')) return;
  if(el.matches('tr[data-act]')&&e.target.closest('button,a,.inline-edit,.tog')) return;
  if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href').startsWith('#/')) return;
  e.preventDefault(); act(el.getAttribute('data-act'),Object.assign({},el.dataset),el); });
document.addEventListener('change',e=>{ const el=e.target; const a=el.getAttribute('data-act'); if(!a) return;
  if(a==='selall'){ const t=el.getAttribute('data-t'); const set=t==='cattable'?S.ui.catalog.sel:S.ui.media.sel; $$(`#${t} tbody input[data-act="selrow"]`).forEach(c=>{ if(el.checked) set.add(isNaN(+c.dataset.id)?c.dataset.id:+c.dataset.id); else set.delete(isNaN(+c.dataset.id)?c.dataset.id:+c.dataset.id); }); render(); }
  else if(a==='selrow'){ const t=el.getAttribute('data-t'); const set=t==='cattable'?S.ui.catalog.sel:S.ui.media.sel; const id=isNaN(+el.dataset.id)?el.dataset.id:+el.dataset.id; const idx=+el.dataset.idx; const u=S.ui.catalog; if(e.shiftKey&&u.last!=null&&t==='cattable'){ const rows=$$(`#${t} tbody input[data-act="selrow"]`); const [a1,b1]=[Math.min(u.last,idx),Math.max(u.last,idx)]; rows.slice(a1,b1+1).forEach(c=>set.add(c.dataset.id)); } else { if(el.checked) set.add(id); else set.delete(id); } u.last=idx; render(); }
  else if(a==='col'){ act('col',{k:el.dataset.k}); }
  else if(a==='macro'){ act('macro',{},el); }
  else if(a==='price-calc'){ act('price-calc',el.dataset); } });
document.addEventListener('input',e=>{ const el=e.target; const a=el.getAttribute('data-act'); if(el.id==='catq'){ S.ui.catalog.q=el.value.toLowerCase(); S.ui.catalog.page=1; rerenderKeepFocus(); } else if(a==='audit-actor'){ S.ui.audit.actor=el.value.toLowerCase(); rerenderKeepFocus('[data-act="audit-actor"]'); } else if(a==='audit-entity'){ S.ui.audit.entity=el.value.toLowerCase(); rerenderKeepFocus('[data-act="audit-entity"]'); } else if(a==='price-calc'){ act('price-calc',el.dataset); } else if(a==='user-q'){ /* live filter demo */ $$('#usertable tbody tr').forEach(tr=>{ tr.style.display=tr.textContent.toLowerCase().includes(el.value.toLowerCase())?'':'none'; }); } });
document.addEventListener('mousedown',e=>{ if(e.shiftKey&&e.target.closest('input.cb')) e.preventDefault(); });
document.addEventListener('mousedown',e=>{ const r=e.target.closest('.ratings label'); if(r){ $$('.ratings label').forEach(l=>l.classList.toggle('on',l===r)); } });
/* drag & drop programming */
document.addEventListener('dragstart',e=>{ const ev=e.target.closest('.ev[draggable]'); if(!ev) return; e.dataTransfer.setData('text/plain',ev.dataset.ev); ev.classList.add('dragging'); });
document.addEventListener('dragend',e=>{ const ev=e.target.closest('.ev'); if(ev) ev.classList.remove('dragging'); });
document.addEventListener('dragover',e=>{ const d=e.target.closest('#progcal .day'); if(d){ e.preventDefault(); $$('#progcal .day.over').forEach(x=>x.classList.remove('over')); d.classList.add('over'); } });
document.addEventListener('drop',e=>{ const d=e.target.closest('#progcal .day'); if(!d) return; e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); const ev=PROGRAM.find(x=>x.id===id); if(!ev) return; const prev=ev.d, to=+d.dataset.day; if(prev===to){ render(); return; } ev.d=to; audit(ME,'programming.move',ev.t,`${DAYS[prev]} → ${DAYS[to]}`); withUndo(`Moved “${ev.t}” to ${DAYS[to]}`,()=>{},()=>{ ev.d=prev; }); });
/* scrubber drag */
let scrub=false; document.addEventListener('mousedown',e=>{ if(e.target.closest('#tl .head')||e.target.closest('#tl .track')||e.target.closest('#tl .prog')) { scrub=true; seek(e); } });
document.addEventListener('mousemove',e=>{ if(scrub) seek(e,true); }); document.addEventListener('mouseup',()=>{ if(scrub){ scrub=false; render(); } });
function seek(e,live){ const tl=$('#tl'); if(!tl) return; const m=MODQ.find(x=>x.id===S.ui.mod.cur)||MODQ[0]; const r=tl.getBoundingClientRect(); const t=clamp((e.clientX-r.left)/r.width,0,1)*m.dur; S.ui.mod.t=t; if(live){ tl.querySelector('.head').style.left=(t/m.dur*100)+'%'; tl.querySelector('.prog').style.width=(t/m.dur*100)+'%'; const tc=$('.player .tc'); if(tc) tc.textContent=mmss(t); } else render(); }

/* ============================================================ init ============================================================ */
if(!location.hash) location.hash='#/overview'; render(); updateBell();
})();
</script>
