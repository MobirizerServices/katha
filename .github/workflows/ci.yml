name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  KATHA_ENV: test          # the backend guard treats UNSET as managed
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: cd backend && uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements-dev.txt
      - name: backend tests + coverage gate (>=98%)
        run: cd backend && .venv/bin/python -m pytest
      - name: contract drift gate
        run: |
          cd backend && PYTHONPATH=packages/ledger:packages/domain:packages/infra:services/core-api .venv/bin/python -c "import json;from app.main import app;cur=open('../contracts/openapi/core-api.json').read();new=json.dumps(app.openapi(),indent=2);exit(0 if cur==new else print('OpenAPI drift: run make openapi') or 1)"

  migrations:
    # Proves the Alembic baseline applies on a real Postgres and that the models
    # and migrations agree (no un-migrated schema drift).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: katha, POSTGRES_USER: katha, POSTGRES_PASSWORD: katha }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U katha" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      KATHA_DB_URL: postgresql+asyncpg://katha:katha@localhost:5432/katha
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: cd backend && uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt
      - name: alembic upgrade head
        run: cd backend && .venv/bin/alembic upgrade head
      - name: alembic check (models == migrations)
        run: cd backend && .venv/bin/alembic check

  security:
    # Non-blocking to start (advisories surface without gating merges); flip to
    # required once the backlog is triaged.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: pip-audit (Python deps)
        run: cd backend && uvx pip-audit -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: npm audit (site)
        run: cd web/site && npm audit --audit-level=high
      - name: npm audit (admin)
        run: cd web/admin && npm audit --audit-level=high

  docker:
    # Validates the backend image builds (Dockerfile + requirements resolve).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build backend image
        run: docker build -f backend/Dockerfile -t katha-backend:ci .

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: iOS KathaKit tests + coverage gate (>=98%)
        run: cd ios/KathaKit && ./coverage.sh

  web-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd web/site && npm ci && npx tsc --noEmit && npm run build
      - name: web/site tests + coverage gates (98 lines / 95 branches)
        run: cd web/site && npm run coverage

  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd web/admin && npm ci && npm run build      # tsc -b + vite build: type errors fail here
      - name: web/admin tests + coverage gates (98 lines / 95 branches)
        run: cd web/admin && npm run coverage

  e2e:
    # The Playwright money-path suite: real OIDC dev IdP + real ledger over a
    # throwaway SQLite, driven in the runner's Chrome (no browser download).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: cd backend && uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd web/admin && npm ci
      - name: admin money-path e2e (Playwright)
        run: cd web/admin && npm run test:e2e
