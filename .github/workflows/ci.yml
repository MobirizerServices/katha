name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd backend && uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python "fastapi>=0.115" "uvicorn[standard]" "pydantic>=2" httpx sqlalchemy aiosqlite pyjwt pytest pytest-cov
      - name: backend tests + coverage gate (>=95%)
        run: cd backend && .venv/bin/python -m pytest
      - name: contract drift gate
        run: cd backend && PYTHONPATH=packages/ledger:packages/domain:services/core-api .venv/bin/python -c "import json;from app.main import app;cur=open('../contracts/openapi/core-api.json').read();new=json.dumps(app.openapi(),indent=2);exit(0 if cur==new else print('OpenAPI drift: run make openapi') or 1)"
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: iOS KathaKit tests + coverage gate (>=95%)
        run: cd ios/KathaKit && ./coverage.sh
  web-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web/site && npm install && npm run build
      - name: web/site tests + coverage gate (>=95%)
        run: cd web/site && npm run coverage
  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: web/admin tests + coverage gate (>=95%)
        run: cd web/admin && npm install && npm run coverage
