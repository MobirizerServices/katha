[pytest]
# Canonical backend test run: from backend/ just run `pytest`.
# Coverage gate: the build FAILS if total coverage drops below 95%.
testpaths =
    packages/ledger/tests
    services/core-api/tests
    services/admin-api/tests
addopts =
    --cov=katha_ledger
    --cov=katha_domain
    --cov=katha_infra
    --cov=app
    --cov=admin_app
    --cov-report=term-missing:skip-covered
    --cov-fail-under=98
filterwarnings =
    ignore::DeprecationWarning
