[project]
name = "katha-infra"
version = "0.1.0"
description = "Katha infra adapters — async SQLAlchemy persistence for the pure coin ledger"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "katha-ledger",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["katha_infra"]
