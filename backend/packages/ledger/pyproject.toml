[project]
name = "katha-ledger"
version = "0.1.0"
description = "Katha coin ledger — the money source of truth (pure, dependency-free)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["katha_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
