# Katha edge reverse proxy for the QA stack. Terminates TLS, applies security
# headers and rate limits, routes to the two APIs and the two web apps, and
# serves HLS bytes directly via X-Accel-Redirect (the app authorizes, nginx
# streams). Replace server_name + the cert paths for your QA host; certs are
# mounted at /etc/nginx/certs (Let's Encrypt via certbot, or self-signed for QA).
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 12m;

  # HLS content types for the X-Accel media path.
  types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; video/mp4 mp4; }

  # --- rate-limit zones (P0-7 edge layer; the app adds per-user limits too) ---
  # Per-IP is a flood stop only: Indian mobile traffic sits behind carrier NAT,
  # so one address is a whole cohort. The real OTP budget is per PHONE, in the
  # app (3 codes/hour, 5 attempts, carried across resends).
  limit_req_zone $binary_remote_addr zone=auth:10m  rate=60r/m;   # OTP / login
  limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;   # general API
  limit_req_status 429;

  upstream core_api  { server backend:8799; keepalive 32; }
  upstream admin_api { server admin-backend:8799; keepalive 16; }
  upstream site      { server web-site:3000; keepalive 16; }
  upstream admin_spa { server web-admin:8080; keepalive 8; }

  # TLS session resumption + a modern cipher list (TLS 1.3 picks its own).
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;

  # Common proxy + security headers.
  map $host $hsts { default "max-age=31536000; includeSubDomains"; }

  # HTTP → HTTPS.
  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # ---- app host: site + public API + media ----
  server {
    listen 443 ssl;
    http2 on;
    server_name qa.katha.example;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";                  # lets the upstream keepalive pools work
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # the real peer only — never a client-supplied chain
    proxy_set_header X-Forwarded-Proto $scheme;

    # Auth endpoints: strict per-IP limit against OTP brute force.
    location /v1/auth/ {
      limit_req zone=auth burst=30 nodelay;
      proxy_pass http://core_api;
    }
    location /v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://core_api;
    }
    location = /health { proxy_pass http://core_api; }
    location = /ready  { proxy_pass http://core_api; }

    # Media: the app checks the stream token, then returns X-Accel-Redirect so
    # nginx streams the bytes from the media volume without touching Python.
    location /media/ {
      proxy_pass http://core_api;
    }
    location /__media/ {
      internal;
      alias /srv/media/;
      add_header Cache-Control "public, max-age=300";
      # add_header is not inherited once a block sets its own: repeat the
      # security headers so every HLS segment carries them.
      add_header Strict-Transport-Security $hsts always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Everything else → the Next.js site.
    location / { proxy_pass http://site; }
  }

  # ---- admin host: SPA + admin API ----
  server {
    listen 443 ssl;
    http2 on;
    server_name admin-qa.katha.example;

    # The back office is never public: only the CIDRs listed in
    # deploy/nginx/admin-allow.conf (VPN / office egress) get past this line.
    # The shipped file denies everything until you add your ranges.
    include /etc/nginx/admin-allow.conf;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";                  # lets the upstream keepalive pools work
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # the real peer only — never a client-supplied chain
    proxy_set_header X-Forwarded-Proto $scheme;

    location /admin/v1/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://admin_api;
    }
    location / { proxy_pass http://admin_spa; }
  }
}
