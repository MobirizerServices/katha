# Network allowlist for the admin host (included inside its `server` block).
# Add one `allow` line per VPN / office egress CIDR, keep `deny all` last, and
# mirror the same ranges in KATHA_ADMIN_IP_ALLOWLIST so the API enforces it too.
#
#   allow 10.8.0.0/24;          # WireGuard VPN
#   allow 203.0.113.7/32;       # office static egress
#
deny all;
