# Serves the admin SPA; every unknown path falls back to index.html (client-side
# routing). The edge proxy terminates TLS and forwards /admin/v1 to admin-api.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets, never cache the HTML shell.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
